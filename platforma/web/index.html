<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Virtaks</title>
<link rel="stylesheet" href="/static/ui.css?v=2">
<script src="/static/ui.js?v=2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/mermaid.min.js"></script>
<style>
/* ====================================================== chat sahifasi */
.suhbat-ich { max-width: 780px; margin: 0 auto; padding: 26px 22px 32px; }

/* --- xabarlar --- */
.juft { margin-bottom: 30px; }
.xabar-user { display: flex; justify-content: flex-end; margin-bottom: 20px; }
.xabar-user .puf {
  background: var(--yuza2); border: 1px solid var(--chiz);
  border-radius: var(--r-k) var(--r-k) 4px var(--r-k);
  padding: 11px 15px; max-width: 78%; white-space: pre-wrap;
  word-break: break-word; line-height: 1.6;
}
.xabar-twin { position: relative; }
.twin-nom {
  display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
  font-size: 12.5px; font-weight: 600; color: var(--xira);
}
.twin-nom .nuqta {
  width: 20px; height: 20px; border-radius: 6px; flex: none;
  background: var(--urgu); color: var(--urgu-matn);
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
}
.javob { line-height: 1.72; word-break: break-word; }
.javob > *:first-child { margin-top: 0; }
.javob > *:last-child { margin-bottom: 0; }
.javob h1, .javob h2, .javob h3, .javob h4 { margin: 22px 0 10px; }
.javob h1 { font-size: 20px; } .javob h2 { font-size: 18px; }
.javob h3 { font-size: 16px; } .javob h4 { font-size: 15px; }
.javob p { margin: 0 0 13px; }
.javob ul, .javob ol { margin: 0 0 13px; padding-left: 22px; }
.javob li { margin: 5px 0; }
.javob li > ul, .javob li > ol { margin: 5px 0; }
.javob strong { font-weight: 650; }
.javob blockquote {
  margin: 0 0 13px; padding: 2px 0 2px 14px;
  border-left: 3px solid var(--chiz2); color: var(--matn2);
}
.javob code {
  font: 13px var(--shrift-kod); background: var(--yuza2);
  padding: 1.5px 5px; border-radius: 5px; border: 1px solid var(--chiz);
}
.javob pre.kod {
  background: var(--yuza2); border: 1px solid var(--chiz);
  border-radius: var(--r-o); padding: 13px 15px; overflow-x: auto;
  margin: 0 0 13px; font: 13px/1.55 var(--shrift-kod);
}
.javob pre.kod code { background: none; border: 0; padding: 0; }
.javob table {
  width: 100%; border-collapse: collapse; margin: 0 0 15px; font-size: 14px;
  display: block; overflow-x: auto;
}
.javob th, .javob td {
  border: 1px solid var(--chiz); padding: 8px 11px; text-align: left;
  vertical-align: top;
}
.javob th { background: var(--yuza2); font-weight: 600; }
.javob hr { margin: 18px 0; }
.mermaid-quti {
  background: var(--yuza2); border: 1px solid var(--chiz);
  border-radius: var(--r-o); padding: 14px; margin: 0 0 14px;
  overflow-x: auto; text-align: center;
}

/* iqtibos [n] */
.iq {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 17px; height: 17px; padding: 0 4px; margin: 0 1px;
  vertical-align: 1px; border-radius: 5px;
  background: var(--urgu-fon); color: var(--urgu);
  font: 600 11px/1 var(--shrift); cursor: pointer; border: 1px solid transparent;
  transition: background .13s, border-color .13s;
}
@media (hover: hover) { .iq:hover { border-color: var(--urgu); } }

/* kursor (yozilmoqda) */
.kursor {
  display: inline-block; width: 7px; height: 15px; vertical-align: -2px;
  background: var(--urgu); border-radius: 1px; margin-left: 2px;
  animation: lip 1s steps(2) infinite;
}
@keyframes lip { 50% { opacity: 0; } }

/* javob ostidagi amallar */
.javob-amal {
  display: flex; gap: 2px; margin-top: 10px; align-items: center;
  opacity: 0; transition: opacity .16s var(--yumshoq);
}
.xabar-twin:hover .javob-amal, .javob-amal.korin, .javob-amal:focus-within { opacity: 1; }
@media (hover: none) { .javob-amal { opacity: 1; } }
.javob-amal .tug-ikon { width: 30px; height: 30px; font-size: 13px; }

/* manbalar */
.manba-blok { margin-top: 14px; }
.manba-blok summary {
  cursor: pointer; font-size: 13px; color: var(--xira);
  padding: 7px 10px; border-radius: var(--r-o); list-style: none;
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--chiz); background: var(--yuza);
}
.manba-blok summary::-webkit-details-marker { display: none; }
@media (hover: hover) { .manba-blok summary:hover { background: var(--yuza2); color: var(--matn2); } }
.manba-royxat { margin-top: 9px; display: flex; flex-direction: column; gap: 6px; }
.manba-q {
  display: flex; align-items: flex-start; gap: 9px; padding: 9px 11px;
  background: var(--yuza); border: 1px solid var(--chiz);
  border-radius: var(--r-o); cursor: pointer; font-size: 13.5px;
  text-align: left; width: 100%; color: inherit; font-family: inherit;
  transition: border-color .14s, background .14s;
}
@media (hover: hover) { .manba-q:hover { border-color: var(--urgu); background: var(--urgu-fon); } }
.manba-q .raq {
  flex: none; min-width: 20px; height: 20px; border-radius: 5px;
  background: var(--urgu-fon); color: var(--urgu);
  display: grid; place-items: center; font: 600 11px/1 var(--shrift);
}
.manba-q .nom { flex: 1; min-width: 0; }
.manba-q .joy { color: var(--xira); font-size: 12.5px; margin-top: 2px; }
.manba-q.milt { animation: milt 1.4s var(--yumshoq); }
@keyframes milt { 0%,100% { background: var(--yuza); } 30% { background: var(--urgu-fon); } }

/* biriktirma fayl */
.birik {
  display: flex; align-items: center; gap: 11px; margin-top: 13px;
  padding: 11px 14px; border-radius: var(--r-o);
  background: var(--yashil-fon); border: 1px solid transparent;
}
.birik .nom { flex: 1; font-size: 14px; font-weight: 500; }

/* --- jonli holat --- */
.jonli { display: flex; align-items: center; gap: 9px; color: var(--xira); font-size: 14px; }

/* --- hero (bo'sh chat) --- */
.hero { padding: 8vh 0 30px; text-align: center; }
.hero .belgi-katta {
  width: 52px; height: 52px; border-radius: var(--r-k); margin: 0 auto 18px;
  background: var(--urgu); color: var(--urgu-matn);
  display: grid; place-items: center; font-size: 22px; font-weight: 700;
}
.hero h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: -.02em; }
.hero .tan { color: var(--xira); font-size: 15px; max-width: 460px; margin: 0 auto; }
.namuna-tor {
  display: grid; gap: 9px; margin: 26px auto 0; max-width: 560px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}
.namuna {
  text-align: left; padding: 12px 14px; border-radius: var(--r-o);
  border: 1px solid var(--chiz); background: var(--yuza);
  font: 14px/1.5 var(--shrift); color: var(--matn2); cursor: pointer;
  transition: border-color .15s, background .15s, transform .1s;
}
@media (hover: hover) {
  .namuna:hover { border-color: var(--urgu); background: var(--urgu-fon); color: var(--matn); }
}
.namuna:active { transform: translateY(1px); }

/* --- yozish maydoni --- */
.yozish { padding: 0 22px 18px; background: var(--fon); }
.yozish-ich { max-width: 780px; margin: 0 auto; }
.y-karta {
  background: var(--yuza); border: 1px solid var(--chiz2);
  border-radius: var(--r-k); box-shadow: var(--soya-o);
  transition: border-color .16s var(--yumshoq), box-shadow .16s var(--yumshoq);
}
.y-karta:focus-within { border-color: var(--urgu); box-shadow: 0 0 0 3px var(--urgu-fon); }
#savol {
  width: 100%; border: 0; background: none; resize: none; outline: none;
  padding: 13px 15px 4px; font: 15px/1.6 var(--shrift); color: var(--matn);
  max-height: 200px; box-shadow: none;
}
#savol:focus { box-shadow: none; border: 0; }
.y-oyoq {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px 9px 13px;
}
.y-oyoq .osdi { display: flex; align-items: center; gap: 7px; }
#jonat {
  width: 32px; height: 32px; border-radius: 9px; border: 0; flex: none;
  background: var(--urgu); color: var(--urgu-matn);
  display: grid; place-items: center; cursor: pointer; font-size: 14px;
  transition: opacity .15s, background .15s;
}
#jonat[disabled] { opacity: .35; cursor: not-allowed; }
#jonat.toxtat { background: var(--matn); color: var(--fon); }
.yozish-izoh {
  text-align: center; font-size: 11.5px; color: var(--xira2); margin-top: 8px;
}
.twin-tanlov {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
  border-radius: 20px; border: 1px solid var(--chiz);
  background: var(--yuza2); font-size: 12.5px; color: var(--matn2);
  cursor: pointer; max-width: 210px;
}
@media (hover: hover) { .twin-tanlov:hover { border-color: var(--xira2); } }
.twin-tanlov .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- suhbatlar ro'yxati --- */
.suhbat-q {
  display: flex; align-items: center; gap: 6px; padding: 7px 10px;
  border-radius: var(--r-o); cursor: pointer; font-size: 13.5px;
  color: var(--matn2); border: 0; background: none; width: 100%;
  text-align: left; font-family: inherit; line-height: 1.4;
}
@media (hover: hover) { .suhbat-q:hover { background: var(--yuza3); color: var(--matn); } }
.suhbat-q.faol { background: var(--yuza); color: var(--matn); box-shadow: var(--soya-s); }
.suhbat-q .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suhbat-q .tug-ikon { width: 24px; height: 24px; font-size: 12px; opacity: 0; }
@media (hover: hover) { .suhbat-q:hover .tug-ikon { opacity: 1; } }
@media (hover: none) { .suhbat-q .tug-ikon { opacity: .6; } }

/* --- user karta --- */
.user-q {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  border-radius: var(--r-o); cursor: pointer; width: 100%; border: 0;
  background: none; text-align: left; font-family: inherit; color: var(--matn);
}
@media (hover: hover) { .user-q:hover { background: var(--yuza3); } }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; flex: none; object-fit: cover;
  background: var(--urgu); color: var(--urgu-matn);
  display: grid; place-items: center; font: 600 12px/1 var(--shrift);
}
.user-q .malumot { flex: 1; min-width: 0; }
.user-q .ism { font-size: 13.5px; font-weight: 500; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; display: block; }
.user-q .rol { font-size: 11.5px; color: var(--xira); display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- kvota kartasi --- */
.pul-k {
  margin: 0 0 8px; padding: 11px 12px; border-radius: var(--r-o);
  background: var(--yuza); border: 1px solid var(--chiz); font-size: 12.5px;
}
.pul-k .chiziq { height: 5px; border-radius: 3px; background: var(--yuza3); margin: 7px 0 5px; }
.pul-k .chiziq i { display: block; height: 100%; border-radius: 3px; background: var(--urgu); }

/* --- kirish ekrani --- */
.kirish-ekran {
  position: fixed; inset: 0; z-index: 100; background: var(--fon);
  display: grid; place-items: center; padding: 20px; overflow-y: auto;
}
.kirish-karta { width: 100%; max-width: 400px; }
.kirish-karta .logo {
  width: 46px; height: 46px; border-radius: var(--r-k); margin: 0 auto 16px;
  background: var(--urgu); color: var(--urgu-matn);
  display: grid; place-items: center; font-size: 20px; font-weight: 700;
}
/* Ustoz surati bo'lsa logo o'rniga o'sha ko'rsatiladi — kirish sahifasi
   mavhum «DT» emas, aniq odamning yuzi bilan ochiladi. */
.kirish-karta .logo.rasmli {
  width: 92px; height: 92px; border-radius: 50%; overflow: hidden;
  background: var(--yuza2); padding: 0; margin-bottom: 18px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .16), 0 0 0 3px var(--fon),
              0 0 0 4px var(--chiz);
}
.kirish-karta .logo.rasmli img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.kirish-karta h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
.kirish-karta .tan { text-align: center; color: var(--xira); font-size: 14px; margin-bottom: 22px; }
.ajratgich {
  display: flex; align-items: center; gap: 11px; margin: 18px 0;
  color: var(--xira2); font-size: 12px;
}
.ajratgich::before, .ajratgich::after {
  content: ""; flex: 1; height: 1px; background: var(--chiz);
}
.kirish-almash { text-align: center; margin-top: 16px; font-size: 13.5px; color: var(--xira); }
.kirish-almash button {
  border: 0; background: none; color: var(--urgu); cursor: pointer;
  font: inherit; font-weight: 500; padding: 2px 4px;
}
.tg-tugma { display: flex; justify-content: center; min-height: 40px; }
/* Telegram tugmasi alohida sahifada (/tg-widget) — sababi index.html dagi
   tgRamka() izohida. O'lcham widget sahifasidan postMessage bilan keladi;
   shungacha ko'rinmaydi, aks holda tungi mavzuda bo'sh to'rtburchak yonib
   turadi. `color-scheme` MAJBURLANMAYDI: `normal` qo'yilsa brauzer iframe
   kanvasini oq bo'yaydi va tugma ostida oq tasma chiqadi. */
/* .tg-ramka — ui.css da (admin va kabinet sahifalari ham ishlatadi) */

/* --- chap paneldagi ustoz kartasi (surat + nom + almashtirish) --- */
.ustoz-k {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  padding: 6px 8px 6px 6px; border: 1px solid transparent;
  border-radius: var(--r-o); background: none; color: inherit; font: inherit;
  text-align: left; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.ustoz-rasm {
  flex: none; width: 42px; height: 42px; border-radius: 12px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, var(--urgu), var(--urgu-t, var(--urgu)));
  color: #fff; font-weight: 700; font-size: 14px; letter-spacing: .4px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
}
.ustoz-rasm img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ustoz-matn { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.ustoz-nom {
  font-weight: 600; font-size: 14.5px; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ustoz-tag {
  font-size: 11.5px; color: var(--xira); line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ustoz-chev { flex: none; color: var(--xira2); font-size: 14px; line-height: 1; }
@media (hover: hover) {
  .ustoz-k:hover { background: var(--yuza2); border-color: var(--chiz); }
}
/* ustoz tanlash oynasidagi qatorlar */
.ustoz-q { display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; }
.ustoz-q .ustoz-rasm { width: 46px; height: 46px; border-radius: 13px; }

/* --- fragment oynasi --- */
.fr-matn {
  background: var(--yuza2); border: 1px solid var(--chiz);
  border-radius: var(--r-o); padding: 13px 15px; line-height: 1.7;
  max-height: 300px; overflow-y: auto; font-size: 14px; white-space: pre-wrap;
}
/* Manba matni: oddiy matn bo'laklari va haqiqiy jadvallar bitta scrollda.
   Jadvalning o'z gorizontal scrolli `.jadval-quti` dan keladi. */
.fr-quti { max-height: 340px; overflow-y: auto; }
.fr-quti > * + * { margin-top: 10px; }
.fr-quti .fr-matn { max-height: none; overflow: visible; }
.fr-quti table.jadval th { position: static; }
.fr-quti table.jadval th, .fr-quti table.jadval td { padding: 7px 11px; }
.fr-rasm { width: 100%; border-radius: var(--r-o); border: 1px solid var(--chiz); }
audio { width: 100%; margin: 4px 0; }

/* --- rejalar --- */
.reja-tor { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.reja {
  border: 1px solid var(--chiz); border-radius: var(--r-k); padding: 16px;
  display: flex; flex-direction: column; gap: 9px; background: var(--yuza);
}
.reja.tavsiya { border-color: var(--urgu); box-shadow: 0 0 0 3px var(--urgu-fon); }
.reja .narx { font-size: 21px; font-weight: 650; letter-spacing: -.02em; }

/* --- tanishuv --- */
.tn-progress { height: 4px; background: var(--yuza3); border-radius: 2px; margin-bottom: 18px; }
.tn-progress i { display: block; height: 100%; background: var(--urgu);
  border-radius: 2px; transition: width .25s var(--yumshoq); }
.tn-variant {
  display: block; width: 100%; text-align: left; padding: 12px 14px;
  border: 1px solid var(--chiz); border-radius: var(--r-o); background: var(--yuza);
  margin-bottom: 8px; cursor: pointer; font: 14px/1.45 var(--shrift); color: var(--matn);
  transition: border-color .14s, background .14s;
}
@media (hover: hover) { .tn-variant:hover { border-color: var(--urgu); background: var(--urgu-fon); } }
.tn-variant.tanlangan { border-color: var(--urgu); background: var(--urgu-fon); }

/* --- impersonation banneri --- */
.imp-banner {
  background: var(--sariq-fon); color: var(--sariq); text-align: center;
  padding: 7px 14px; font-size: 13px; display: flex; align-items: center;
  justify-content: center; gap: 12px; flex-wrap: wrap;
  border-bottom: 1px solid var(--chiz);
}

@media (max-width: 900px) {
  .suhbat-ich { padding: 18px 15px 24px; }
  .yozish { padding: 0 12px 12px; }
  .xabar-user .puf { max-width: 88%; }
  .hero { padding: 5vh 0 20px; }
  .hero h1 { font-size: 22px; }
}
</style>
</head>
<body>

<!-- ======================================================== asosiy ilova -->
<div class="karkas yashirin" id="ilova">
  <aside class="yon" id="yon">
    <div class="yon-bosh">
      <div class="qator" style="margin-bottom:12px;gap:6px">
        <button class="ustoz-k" id="ustoz-k" type="button" aria-haspopup="dialog"
                title="Ustozni almashtirish">
          <span class="ustoz-rasm" id="ustoz-rasm" aria-hidden="true">V</span>
          <span class="ustoz-matn">
            <span class="ustoz-nom" id="ustoz-nom">Virtaks</span>
            <span class="ustoz-tag" id="ustoz-tag">ustozning raqamli nusxasi</span>
          </span>
          <span class="ustoz-chev" aria-hidden="true">⌄</span>
        </button>
        <button class="tug-ikon osdi mobil-faqat" id="yon-yop" aria-label="Yopish">✕</button>
      </div>
      <button class="tug asosiy keng" id="yangi-suhbat" type="button">
        <span aria-hidden="true">✚</span> Yangi suhbat
      </button>
      <button class="tug keng yashirin" id="maqsad-tug" type="button"
              style="margin-top:8px;justify-content:flex-start">
        <span aria-hidden="true">🎯</span>
        <span style="flex:1;text-align:left">Maqsadim</span>
        <span class="belgi urgu-b yashirin" id="maqsad-belgi"></span>
      </button>
      <button class="tug keng yashirin" id="mentor-tug" type="button"
              style="margin-top:8px;justify-content:flex-start">
        <span aria-hidden="true">📚</span>
        <span style="flex:1;text-align:left">O'quv rejam</span>
        <span class="belgi urgu-b yashirin" id="mentor-belgi"></span>
      </button>
      <button class="tug keng yashirin" id="tizim-tug" type="button"
              style="margin-top:8px;justify-content:flex-start">
        <span aria-hidden="true">🏭</span>
        <span style="flex:1;text-align:left">Biznes tizimi</span>
        <span class="belgi urgu-b yashirin" id="tizim-belgi"></span>
      </button>
      <input type="search" id="filtr" placeholder="Suhbatlardan qidirish"
             aria-label="Suhbatlardan qidirish" style="margin-top:10px">
    </div>
    <div class="yon-tan" id="tarix"></div>
    <div class="yon-oyoq">
      <div id="pul-quti"></div>
      <button class="user-q" id="user-tugma" type="button" aria-haspopup="dialog">
        <span class="avatar" id="user-avatar">?</span>
        <span class="malumot">
          <span class="ism" id="user-ism">—</span>
          <span class="rol" id="user-rol"></span>
        </span>
        <span aria-hidden="true" style="color:var(--xira)">⋯</span>
      </button>
    </div>
  </aside>

  <main class="asos">
    <div id="imp-joy"></div>
    <header class="asos-bosh">
      <button class="tug-ikon mobil-faqat" id="menyu-tug" aria-label="Menyu">☰</button>
      <div id="bosh-sarlavha" style="font-weight:600;font-size:14.5px;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap">Yangi suhbat</div>
      <div class="osdi qator">
        <button class="tug-ikon" id="mavzu-tug" aria-label="Mavzuni almashtirish">◐</button>
      </div>

<script>
(function () {
"use strict";
const { $, $$, esc, h, api, toast, modal, xatoToast } = UI;

/* ====================================================== holat */
let KONFIG = null, USER = null, TWINLAR = [], JORIY_TWIN = null;
let SUHBATLAR = [], JORIY = null;      // JORIY = joriy suhbat id
let OQIMDA = false, ABORT = null;
let mermaidTayyor = false;
const twa = window.Telegram && window.Telegram.WebApp;

/* ====================================================== markdown
   Havola va rasm sintaksisi ATAYLAB qo'llanmaydi: javob matniga manba
   fayllari ta'sir qilishi mumkin (prompt injection), shuning uchun modeldan
   kelgan matn hech qachon bosiladigan tashqi havolaga aylanmaydi.        */
/* Markdown jadval qatorini kataklarga bo'ladi. `\|` — katak ichidagi
   haqiqiy quvur belgisi (xlsx o'quvchisi shunday ekranlaydi), u ustun
   chegarasi sifatida qabul qilinmaydi. Lookbehind regexdan ataylab voz
   kechildi: eski iOS Safari'da u butun skriptni yiqitadi. */
function jadvalKataklari(s) {
  const xom = s.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
  const chiq = [];
  let joriy = "";
  for (let i = 0; i < xom.length; i++) {
    if (xom[i] === "\\" && xom[i + 1] === "|") { joriy += "|"; i++; continue; }
    if (xom[i] === "|") { chiq.push(joriy.trim()); joriy = ""; continue; }
    joriy += xom[i];
  }
  chiq.push(joriy.trim());
  return chiq;
}

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, function (m, k) { return "<code>" + k + "</code>"; })
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, function (m, r) {
      return r.split(",").map(function (n) {
        n = n.trim();
        return '<span class="iq" role="button" tabindex="0" data-n="' + n +
               '" title="Manbani ochish">' + n + "</span>";
      }).join("");
    });
}

function md(matn) {
  const bloklar = [];
  matn = String(matn == null ? "" : matn)
    .replace(/```(\w*)\n?([\s\S]*?)```/g, function (m, til, kod) {
      bloklar.push({ til: (til || "").toLowerCase(), kod: kod });
      return "\n␀B" + (bloklar.length - 1) + "␀\n";
    });

  const qator = matn.split("\n");
  let ch = "", i = 0;
  const royxat = [];

  function royxatYop(daraja) {
    while (royxat.length > daraja) ch += "</" + royxat.pop() + ">";
  }

  while (i < qator.length) {
    const q = qator[i];
    const bt = q.match(/^␀B(\d+)␀$/);
    if (bt) {
      royxatYop(0);
      const b = bloklar[+bt[1]];
      if (b.til === "mermaid") {
        ch += '<div class="mermaid-quti"><div class="mm" data-kod="' +
              esc(b.kod) + '"></div></div>';
      } else {
        ch += '<pre class="kod"><code>' + esc(b.kod.replace(/\n$/, "")) + "</code></pre>";
      }
      i++; continue;
    }
    // jadval
    if (/\|/.test(q) && i + 1 < qator.length &&
        /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(qator[i + 1])) {
      royxatYop(0);
      const kat = jadvalKataklari;
      ch += "<table><thead><tr>" +
            kat(q).map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") +
            "</tr></thead><tbody>";
      i += 2;
      while (i < qator.length && /\|/.test(qator[i]) && qator[i].trim()) {
        ch += "<tr>" +
              kat(qator[i]).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") +
              "</tr>";
        i++;
      }
      ch += "</tbody></table>"; continue;
    }
    let m = q.match(/^(#{1,4})\s+(.*)$/);
    if (m) {
      royxatYop(0);
      const d = Math.min(4, m[1].length + 1);
      ch += "<h" + d + ">" + inline(m[2]) + "</h" + d + ">"; i++; continue;
    }
    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(q)) { royxatYop(0); ch += "<hr>"; i++; continue; }
    if (/^\s*>\s?/.test(q)) {
      royxatYop(0);
      const b = [];
      while (i < qator.length && /^\s*>\s?/.test(qator[i])) {
        b.push(qator[i].replace(/^\s*>\s?/, "")); i++;
      }
      ch += "<blockquote>" +
            b.map(function (x) { return "<p>" + inline(x) + "</p>"; }).join("") +
            "</blockquote>";
      continue;
    }
    m = q.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (m) {
      const daraja = Math.floor(m[1].length / 2) + 1;
      const teg = /\d/.test(m[2]) ? "ol" : "ul";
      while (royxat.length < daraja) { ch += "<" + teg + ">"; royxat.push(teg); }
      royxatYop(daraja);
      ch += "<li>" + inline(m[3]) + "</li>"; i++; continue;
    }
    if (!q.trim()) { royxatYop(0); i++; continue; }
    royxatYop(0);
    const p = [q]; i++;
    while (i < qator.length && qator[i].trim() &&
           !/^(#{1,4}\s|\s*[-*+]\s|\s*\d+[.)]\s|\s*>|␀B)/.test(qator[i]) &&
           !/^\s*(---+|\*\*\*+)\s*$/.test(qator[i])) { p.push(qator[i]); i++; }
    ch += "<p>" + inline(p.join(" ")) + "</p>";
  }
  royxatYop(0);
  return ch;
}

function mermaidChiz(joy) {
  const el = $$(".mm", joy).filter(function (x) { return !x.dataset.chizildi; });
  if (!el.length || !window.mermaid) return;
  if (!mermaidTayyor) {
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict",
      theme: UI.mavzu.tundami() ? "dark" : "default" });
    mermaidTayyor = true;
  }
  el.forEach(function (x, n) {
    x.dataset.chizildi = "1";
    const kod = x.dataset.kod || "";
    mermaid.render("mm-" + Date.now() + "-" + n, kod)
      .then(function (r) { x.innerHTML = r.svg; })
      .catch(function () { x.textContent = kod; });
  });
}

/* ====================================================== xabar chizish */
function twinHarf(nom) { return String(nom || "T").trim().charAt(0).toUpperCase(); }

/* Ustoz surati: `avatar` bo'lsa rasm, bo'lmasa ism harfi. Rasm yuklanmasa
   ham karta buzilmaydi — harfga qaytadi. */
function ustozRasm(t, sinf) {
  const q = h("span." + (sinf || "ustoz-rasm"), { "aria-hidden": "true" });
  if (t && t.avatar) {
    const im = h("img", { src: "/api/twin/" + t.id + "/avatar",
                          alt: "", loading: "lazy" });
    im.onerror = function () { q.textContent = twinHarf(t.nom); };
    q.appendChild(im);
  } else {
    q.textContent = t ? twinHarf(t.nom) : "V";
  }
  return q;
}

/* Chap paneldagi karta — joriy ustozning surati, nomi va bilim hajmi. */
function ustozChiz() {
  const eski = $("#ustoz-rasm");
  if (!eski) return;
  const t = JORIY_TWIN;
  const yangi = ustozRasm(t);
  yangi.id = "ustoz-rasm";
  eski.replaceWith(yangi);
  $("#ustoz-nom").textContent = t ? t.nom : "Virtaks";
  $("#ustoz-tag").textContent = t
    ? (t.bolak_soni ? t.bolak_soni + " bo'lak bilim" : "raqamli ustoz")
    : "ustozning raqamli nusxasi";
  // Bitta ustoz bo'lsa almashtirish strelkasi ma'nosiz — yashiriladi.
  const chev = document.querySelector(".ustoz-chev");
  if (chev) chev.style.visibility = TWINLAR.length > 1 ? "visible" : "hidden";
}

function manbaRoyxat(manbalar, mid) {
  if (!manbalar || !manbalar.length) return null;
  const d = h("details.manba-blok");
  d.appendChild(h("summary", "📚 " + manbalar.length +
    " ta manba — bosing, aynan o'sha joy ochiladi"));
  const r = h("div.manba-royxat");
  manbalar.forEach(function (m) {
    const belgi = (m.audio_bosh != null ? " 🎧" : "") + (m.sahifa_png ? " 🖼" : "");
    r.appendChild(h("button.manba-q", {
      type: "button", "data-mid": mid, "data-n": m.n,
      onclick: function () { fragmentOch(m); },
    },
      h("span.raq", String(m.n)),
      h("span.nom", h("div", (m.manba || "") + belgi),
        h("div.joy", (m.dars ? m.dars + " · " : "") + (m.joy || "")))));
  });
  d.appendChild(r);
  return d;
}

function amalQatori(matn, rec) {
  return h("div.javob-amal",
    h("button.tug-ikon", { type: "button", title: "Nusxalash",
      "aria-label": "Javobni nusxalash",
      onclick: function () { UI.nusxa(matn); } }, "⧉"),
    h("button.tug-ikon", { type: "button", title: "Qayta yaratish",
      "aria-label": "Javobni qayta yaratish",
      onclick: function () { qaytaYarat(rec); } }, "↻"));
}

function juftEl(rec) {
  const juft = h("div.juft", { "data-mid": rec.id });
  juft.appendChild(h("div.xabar-user", h("div.puf", rec.savol)));

  const twin = h("div.xabar-twin");
  const nom = (rec.hisobot && rec.hisobot.twin && rec.hisobot.twin.nom) ||
              (JORIY_TWIN && JORIY_TWIN.nom) || "Ustoz";
  twin.appendChild(h("div.twin-nom", h("span.nuqta", twinHarf(nom)), nom));
  const javob = h("div.javob");
  javob.innerHTML = md(rec.xulosa || "");
  twin.appendChild(javob);
  if (rec.toxtatildi) {
    twin.appendChild(h("div.izoh", { style: "margin-top:8px" }, "⏹ Javob to'xtatildi"));
  }

  const manbalar = (rec.hisobot && rec.hisobot.manbalar) || [];
  const mb = manbaRoyxat(manbalar, rec.id);
  if (mb) twin.appendChild(mb);

  if (rec.biriktirma) {
    twin.appendChild(h("div.birik", h("span", { "aria-hidden": "true" }, "📎"),
      h("span.nom", "Siz uchun tayyorlangan fayl"),
      h("a.tug.kichik-t", { href: "/api/majlis/" + rec.id + "/fayl" }, "⬇ Yuklab olish")));
  }

  twin.appendChild(amalQatori(rec.xulosa || "", rec));
  juft.appendChild(twin);
  mermaidChiz(javob);
  return juft;
}

/* ====================================================== ekranlar */
const NAMUNALAR = [
  "Sotuvni oshirish uchun nimadan boshlashim kerak?",
  "Sovuq qo'ng'iroqda birinchi 30 soniyada nima deyish kerak?",
  "Xodimlarni qanday motivatsiya qilish mumkin?",
  "Mijoz «qimmat» desa nima deyishim kerak?",
];

function heroChiz() {
  const x = $("#xabarlar");
  x.innerHTML = "";
  const nom = (JORIY_TWIN && JORIY_TWIN.nom) || "Ustoz";
  const hero = h("div.hero",
    h("div.belgi-katta", twinHarf(nom)),
    h("h1", "Nima haqida gaplashamiz?"),
    h("div.tan", "«" + nom + "» yuklangan darslar va hujjatlar asosida javob beradi. " +
      "Har javobda manbaga havola bo'ladi."));
  const tor = h("div.namuna-tor");
  NAMUNALAR.forEach(function (n) {
    tor.appendChild(h("button.namuna", { type: "button",
      onclick: function () { $("#savol").value = n; olcham(); yubor(); } }, n));
  });
  hero.appendChild(tor);
  x.appendChild(hero);
  $("#bosh-sarlavha").textContent = "Yangi suhbat";
}

function boshSahna(manzilsiz) {
  JORIY = null;
  ekran("chat");
  if (!manzilsiz && location.hash) location.hash = "";
  heroChiz();
  tarixChiz();
  const s = $("#savol");
  s.value = ""; s.style.height = "auto";
  UI.saqla("twin-qoralama", "");
  if (matchMedia("(hover: hover)").matches) s.focus();
}

async function suhbatOch(sid, manzilsiz) {
  JORIY = sid;
  ekran("chat");
  /* Har suhbatning o'z manzili bor: sahifa yangilanganda yoki havola
     ulashilganda o'sha suhbat ochiladi (Claude'dagi kabi). */
  if (!manzilsiz && location.hash !== "#/s/" + sid) location.hash = "#/s/" + sid;
  tarixChiz();
  yon.yop();
  const x = $("#xabarlar");
  UI.holat.yuklanmoqda(x, "Suhbat yuklanmoqda...");
  try {
    const juftlar = await api.ol("/api/suhbat/" + sid);
    const s = SUHBATLAR.find(function (q) { return q.id === sid; });
    x.innerHTML = "";
    /* Dars va maqsad sikli ham oddiy suhbat — faqat ustida lenta turadi. */
    if (s && s.mavzu_id) x.appendChild(darsLenta(s));
    else if (s && s.maqsad_id) x.appendChild(maqsadLenta(s));
    else if (s && s.tizim_maqsad_id) x.appendChild(tizimLenta(s));
    if (!juftlar.length &&
        !(s && (s.mavzu_id || s.maqsad_id || s.tizim_maqsad_id))) {
      heroChiz(); return;
    }
    juftlar.forEach(function (r) { x.appendChild(juftEl(r)); });
    $("#bosh-sarlavha").textContent = (s && s.sarlavha) || "Suhbat";
    pastga(true);
  } catch (e) {
    UI.holat.xato(x, e, function () { suhbatOch(sid); });
  }
}

function pastga(darhol) {
  const o = $("#oqim");
  o.scrollTo({ top: o.scrollHeight, behavior: darhol ? "auto" : "smooth" });
}

/* ====================================================== yon panel */
function tarixChiz() {
  const q = ($("#filtr").value || "").trim().toLowerCase();
  const joy = $("#tarix");
  joy.innerHTML = "";
  const royxat = q
    ? SUHBATLAR.filter(function (s) {
        return (s.sarlavha || "").toLowerCase().indexOf(q) >= 0; })
    : SUHBATLAR;
  if (!royxat.length) {
    joy.appendChild(h("div.izoh", { style: "padding:14px 10px;text-align:center" },
      q ? "Topilmadi" : "Hali suhbat yo'q"));
    return;
  }
  let oxirgiDavr = null;
  royxat.forEach(function (s) {
    const d = UI.davr(s.yangilangan || s.yaratilgan);
    if (d !== oxirgiDavr) {
      oxirgiDavr = d;
      joy.appendChild(h("div.menyu", h("div.bolim", d)));
    }
    joy.appendChild(h("button.suhbat-q" + (s.id === JORIY ? ".faol" : ""), {
      type: "button",
      onclick: function (e) { if (!e.target.closest(".tug-ikon")) suhbatOch(s.id); },
    },
      h("span.nm", s.sarlavha || "Suhbat"),
      h("span.tug-ikon", { role: "button", tabindex: "0", title: "Amallar",
        "aria-label": "Suhbat amallari",
        onclick: function (e) { e.stopPropagation(); suhbatMenyu(s); },
        onkeydown: function (e) {
          if (e.key === "Enter") { e.stopPropagation(); suhbatMenyu(s); } },
      }, "⋯")));
  });
}

function suhbatMenyu(s) {
  const tan = h("div.ustun",
    h("button.tug.keng", { type: "button", onclick: async function () {
      m.yop();
      const nom = await nomSora(s.sarlavha || "");
      if (!nom) return;
      try {
        await api.yangila("/api/suhbat/" + s.id, { sarlavha: nom });
        s.sarlavha = nom; tarixChiz();
        if (JORIY === s.id) $("#bosh-sarlavha").textContent = nom;
        toast("Nomi o'zgartirildi", "ok");
      } catch (e) { xatoToast(e); }
    } }, "✎ Nomini o'zgartirish"),
    h("button.tug.keng.xavf", { type: "button", onclick: async function () {
      m.yop();
      const ok = await UI.tasdiq({ sarlavha: "Suhbatni o'chirish",
        matn: "«" + (s.sarlavha || "Suhbat") + "» ro'yxatdan olib tashlanadi.",
        tasdiq: "O'chirish", xavfli: true });
      if (!ok) return;
      try {
        await api.ochir("/api/suhbat/" + s.id);
        SUHBATLAR = SUHBATLAR.filter(function (x) { return x.id !== s.id; });
        if (JORIY === s.id) boshSahna(); else tarixChiz();
        toast("O'chirildi", "ok");
      } catch (e) { xatoToast(e); }
    } }, "🗑 O'chirish"));
  const m = modal({ sarlavha: s.sarlavha || "Suhbat", tan: tan });
}

function nomSora(hozirgi) {
  return new Promise(function (javob) {
    const kirit = h("input", { type: "text", value: hozirgi, "aria-label": "Yangi nom" });
    let hal = false;
    modal({
      sarlavha: "Suhbat nomi", tan: h("div", kirit),
      amallar: [
        { nom: "Bekor", uslub: "shaffof",
          onclick: function () { hal = true; javob(null); } },
        { nom: "Saqlash", uslub: "asosiy",
          onclick: function () { hal = true; javob(kirit.value.trim().slice(0, 80) || null); } },
      ],
      yopilganda: function () { if (!hal) javob(null); },
    });
    kirit.focus(); kirit.select();
  });
}

/* ====================================================== twin tanlash */
function twinMenyu() {
  const tan = h("div.ustun");
  TWINLAR.forEach(function (t) {
    const tanlangan = JORIY_TWIN && t.id === JORIY_TWIN.id;
    tan.appendChild(h("button.tug.keng", {
      type: "button",
      style: "justify-content:flex-start;text-align:left;height:auto;padding:12px 14px" +
             (tanlangan ? ";border-color:var(--urgu)" : ""),
      onclick: async function () {
        m.yop();
        JORIY_TWIN = t;
        $("#twin-nom").textContent = t.nom;
        ustozChiz();
        try { await api.yubor("/api/twin", { twin_id: t.id }); } catch (e) {}
        MENTOR = null; MAQSAD = null; TIZIM = null;
        mentorYangila();              // har ustozning o'z o'quv rejasi bor
        maqsadYangila();              // maqsad sikli ham twin bo'yicha alohida
        tizimYangila();               // biznes halqasi ham twinga bog'liq
        if (!JORIY) heroChiz();
      },
    }, h("div.ustoz-q",
      ustozRasm(t),
      h("div", { style: "min-width:0;flex:1" },
        h("div", { style: "font-weight:600" }, t.nom + (tanlangan ? "  ✓" : "")),
        h("div.izoh", (t.tavsif || "").slice(0, 90) ||
          (t.bolak_soni + " bo'lak bilim"))))));
  });
  const m = modal({ sarlavha: "Ustozni tanlang", tan: tan });
}

/* ====================================================== yuborish (SSE) */
function yozishHolati(oqimda) {
  OQIMDA = oqimda;
  const j = $("#jonat");
  j.classList.toggle("toxtat", oqimda);
  j.textContent = oqimda ? "■" : "➤";
  j.setAttribute("aria-label", oqimda ? "To'xtatish" : "Yuborish");
}

/** yubor(qaytaId, majbur)
 *  majbur = {matn, yashirin} — dars boshlanishi kabi tizim yuboradigan
 *  xabarlar uchun: matn maydondan olinmaydi va pufakcha ko'rsatilmaydi. */
async function yubor(qaytaId, majbur) {
  if (OQIMDA) { toxtat(); return; }
  const maydon = $("#savol");
  const savol = majbur ? majbur.matn : (qaytaId ? "" : maydon.value.trim());
  if (!savol && !qaytaId) return;
  if (!JORIY_TWIN) { toast("Avval ustozni tanlang", "xato"); return; }
  const yashirin = !!(majbur && majbur.yashirin);

  if (!qaytaId && !majbur) {
    if ($(".hero")) $("#xabarlar").innerHTML = "";
    maydon.value = ""; maydon.style.height = "auto";
    UI.saqla("twin-qoralama", "");
  }

  const juft = h("div.juft");
  if (!qaytaId && !yashirin) juft.appendChild(h("div.xabar-user", h("div.puf", savol)));
  const twinBlok = h("div.xabar-twin");
  twinBlok.appendChild(h("div.twin-nom",
    h("span.nuqta", twinHarf(JORIY_TWIN.nom)), JORIY_TWIN.nom));
  const holatEl = h("div.jonli", h("div.aylanma"), h("span", "o'ylanmoqda..."));
  const javobEl = h("div.javob");
  twinBlok.appendChild(holatEl);
  twinBlok.appendChild(javobEl);
  juft.appendChild(twinBlok);
  $("#xabarlar").appendChild(juft);
  pastga();
  yozishHolati(true);

  ABORT = new AbortController();
  let matn = "", mid = null, manbalar = [], toxtatildi = false;
  let kutilyapti = false;

  function chiz() {
    if (kutilyapti) return;
    kutilyapti = true;
    requestAnimationFrame(function () {
      kutilyapti = false;
      javobEl.innerHTML = md(matn) + '<span class="kursor"></span>';
      const o = $("#oqim");
      if (o.scrollHeight - o.scrollTop - o.clientHeight < 200) pastga(true);
    });
  }

  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ savol: savol, suhbat: JORIY, twin_id: JORIY_TWIN.id,
                             qayta_id: qaytaId || null }),
      signal: ABORT.signal,
    });

    if (r.status === 402) {
      juft.remove(); yozishHolati(false); ABORT = null;
      let j = null; try { j = await r.json(); } catch (e) {}
      if (j && j.pul) pulChiz(j.pul);
      rejalarOyna(j);
      if (!qaytaId && !majbur) { maydon.value = savol; olcham(); }
      return;
    }
    if (!r.ok) {
      let x = "Xatolik (" + r.status + ")";
      try { const j = await r.json(); x = j.xato || j.xabar || x; } catch (e) {}
      throw new Error(x);
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let bufer = "";
    for (;;) {
      const bolak = await reader.read();
      if (bolak.done) break;
      bufer += dec.decode(bolak.value, { stream: true });
      const qismlar = bufer.split("\n\n");
      bufer = qismlar.pop();
      for (const qism of qismlar) {
        if (qism.indexOf("data: ") !== 0) continue;
        let hd;
        try { hd = JSON.parse(qism.slice(6)); } catch (e) { continue; }
        if (hd.tur === "boshlandi") {
          mid = hd.majlis_id;
          if (!JORIY) {
            JORIY = hd.suhbat_id;
            history.replaceState(null, "", "#/s/" + JORIY);
          }
          juft.dataset.mid = mid;
        } else if (hd.tur === "holat") {
          const s = holatEl.querySelector("span");
          if (s) s.textContent = hd.matn;
        } else if (hd.tur === "matn") {
          if (holatEl.parentNode) holatEl.remove();
          matn += hd.q; chiz();
        } else if (hd.tur === "manbalar") {
          manbalar = hd.royxat || [];
        } else if (hd.tur === "tayyor") {
          toxtatildi = !!hd.toxtatildi;
          if (hd.manbalar && hd.manbalar.length) manbalar = hd.manbalar;
        } else if (hd.tur === "xato") {
          throw new Error(hd.xabar || "Xatolik");
        }
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      toxtatildi = true;
    } else {
      if (holatEl.parentNode) holatEl.remove();
      if (!matn) {
        juft.remove();
        toast(e.message || "Javob olinmadi", "xato");
        yozishHolati(false); ABORT = null;
        if (!qaytaId && !majbur) { maydon.value = savol; olcham(); }
        return;
      }
      toast(e.message || "Javob to'liq kelmadi", "xato");
    }
  }

  yozishHolati(false); ABORT = null;
  if (holatEl.parentNode) holatEl.remove();
  javobEl.innerHTML = md(matn);
  mermaidChiz(javobEl);
  if (toxtatildi) {
    twinBlok.appendChild(h("div.izoh", { style: "margin-top:8px" }, "⏹ Javob to'xtatildi"));
  }
  const mb = manbaRoyxat(manbalar, mid);
  if (mb) twinBlok.appendChild(mb);
  twinBlok.appendChild(amalQatori(matn, { id: mid, savol: savol }));

  await suhbatlarYangila();
  const s = SUHBATLAR.find(function (q) { return q.id === JORIY; });
  if (s) $("#bosh-sarlavha").textContent = s.sarlavha || "Suhbat";
  konfigYangila();
}

function toxtat() {
  if (ABORT) { ABORT.abort(); ABORT = null; }
  yozishHolati(false);
}

/* Manba matnidagi markdown jadvalni haqiqiy <table> ga aylantiradi.
   `md()` bu yerda ATAYLAB ishlatilmaydi: manba matni ishonchsiz kontent,
   undan iqtibos tugmasi, mermaid diagramma yoki HTML yasalmasligi kerak —
   shuning uchun har katak faqat textNode bo'lib qo'yiladi. */
function manbaJadval(qator, i) {
  const kat = jadvalKataklari;
  const jad = h("table.jadval");
  const bosh = h("tr");
  kat(qator[i]).forEach(function (c) { bosh.appendChild(h("th", c)); });
  jad.appendChild(h("thead", bosh));
  const tan = h("tbody");
  let j = i + 2;
  while (j < qator.length && /\|/.test(qator[j]) && qator[j].trim()) {
    const tr = h("tr");
    kat(qator[j]).forEach(function (c) { tr.appendChild(h("td", c)); });
    tan.appendChild(tr);
    j++;
  }
  jad.appendChild(tan);
  return { el: h("div.jadval-quti", jad), keyingi: j };
}

function manbaChiz(matn) {
  const quti = h("div.fr-quti", { style: "margin-top:12px" });
  const qator = String(matn == null ? "" : matn).split("\n");
  let bufer = [];
  function matnYop() {
    /* «## Varaq: Foiz» kabi sarlavha belgilarini olib tashlaymiz — oyna
       tepasida manba nomi allaqachon yozilgan. */
    const s = bufer.join("\n").replace(/^#{1,6}\s+/gm, "").replace(/^\s+|\s+$/g, "");
    bufer = [];
    if (s) quti.appendChild(h("div.fr-matn", s));
  }
  let i = 0;
  while (i < qator.length) {
    if (/\|/.test(qator[i]) && i + 1 < qator.length &&
        /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(qator[i + 1])) {
      matnYop();
      const j = manbaJadval(qator, i);
      quti.appendChild(j.el);
      i = j.keyingi;
      continue;
    }
    bufer.push(qator[i]);
    i++;
  }
  matnYop();
  if (!quti.children.length) quti.appendChild(h("div.fr-matn", ""));
  return quti;
}

  let urinish = 0;
  const tekshir = async function () {
    let t;
    try {
      t = await api.ol("/api/tolov/" + encodeURIComponent(tashqiId));
    } catch (e) {
      chiz("⚠️", "Holatni bilib bo'lmadi",

    if (t.holat === "bekor") {

      return;

        "sahifani yangilang — obuna avtomatik faollashadi.");

    }
    setTimeout(tekshir, 2000);
  };
  tekshir();
}

/* ====================================================== tanishuv testi */
async function tanishuvOch(birinchi) {
  let d;
  try { d = await api.ol("/api/tanishuv"); } catch (e) { xatoToast(e); return; }
  const savollar = d.savollar || [];
  if (!savollar.length) { toast("Savollar topilmadi", "xato"); return; }
  const javoblar = Object.assign({}, d.javoblar || {});
  let n = 0;

  const tan = h("div");
  const progress = h("div.tn-progress", h("i"));
  const ich = h("div");
  tan.appendChild(progress);
  tan.appendChild(ich);

  /* Savollar shartli tarmoqlanadi: `shart` bajarilmagan savol o'tkazib
     yuboriladi (masalan atama darajasi faqat tajribalilardan so'raladi). */
  function mos(s) {
    const sh = s.shart || {};
    return Object.keys(sh).every(function (k) {
      return (sh[k] || []).indexOf(javoblar[k]) >= 0;
    });
  }
  function oldinga(dan) {
    for (let i = dan; i < savollar.length; i++) if (mos(savollar[i])) return i;
    return -1;
  }
  function orqaga(dan) {
    for (let i = dan; i >= 0; i--) if (mos(savollar[i])) return i;
    return -1;
  }

  function chiz() {
    const s = savollar[n];
    const jami = savollar.filter(mos).length;
    const orin = savollar.slice(0, n + 1).filter(mos).length;
    progress.firstChild.style.width = Math.round(((orin - 1) / jami) * 100) + "%";
    ich.innerHTML = "";
    ich.appendChild(h("div.izoh", { style: "margin-bottom:4px" },
      orin + " / " + jami));
    ich.appendChild(h("h3", { style: "margin-bottom:6px" }, s.savol));
    if (s.izoh) ich.appendChild(h("div.izoh", { style: "margin-bottom:14px" }, s.izoh));
    if (s.tur === "matn") {
      const k = h("input", { type: "text", maxlength: "200",
        value: javoblar[s.kod] || "", "aria-label": s.savol });
      k.addEventListener("input", function () { javoblar[s.kod] = k.value; });
      ich.appendChild(k);
    } else {
      (s.javoblar || []).forEach(function (v) {
        ich.appendChild(h("button.tn-variant" +
          (javoblar[s.kod] === v.kod ? ".tanlangan" : ""), {
          type: "button",
          onclick: function () { javoblar[s.kod] = v.kod; keyingi(); },
        }, v.matn));
      });
    }
    const oxirgimi = oldinga(n + 1) < 0;
    ich.appendChild(h("div.qator", { style: "margin-top:16px" },
      orqaga(n - 1) >= 0 ? h("button.tug.shaffof", { type: "button",
        onclick: function () { n = orqaga(n - 1); chiz(); } }, "← Orqaga") : null,
      h("button.tug" + (oxirgimi ? ".asosiy" : ".shaffof") + ".osdi",
        { type: "button", onclick: keyingi },
        oxirgimi ? "Yakunlash" : "O'tkazib yuborish →")));
  }

  async function keyingi() {
    const kn = oldinga(n + 1);
    if (kn >= 0) { n = kn; chiz(); return; }
    try {
      await api.yubor("/api/tanishuv", { javoblar: javoblar });
      oyna.yop();
      toast("Saqlandi — javoblar sizga moslashadi", "ok");
      konfigYangila();
    } catch (e) { xatoToast(e); }
  }

  const oyna = modal({
    sarlavha: birinchi ? "Sizni yaxshiroq tanib olaylik" : "Profil sozlamalari",
    tan: tan,
    amallar: birinchi ? [{ nom: "Keyinroq", uslub: "shaffof",
      onclick: async function () {
        try { await api.yubor("/api/tanishuv/otkaz", {}); } catch (e) {}
      } }] : null,
  });
  chiz();
}

   qayta ishlatiladi. Bu yerda faqat REJA ko'rinishi: modullar, mavzular

const M_HOLAT = {

  otkazilgan:      { kv: "✓",  sinf: "tugadi-k", nom: "Testda bilgansiz — o'tkazildi" },
  majburan_otildi: { kv: "✓",  sinf: "otildi-k", nom: "Yopildi — qaytib ko'rish foydali" },
  joriy:           { kv: "▶",  sinf: "joriy-k",  nom: "Joriy mavzu" },
  vazifada:        { kv: "📝", sinf: "vazifa-k", nom: "Uy vazifasi kutilmoqda" },
  kutmoqda:        { kv: "🔒", sinf: "",         nom: "Hali ochilmagan" },
};

function ekran(nom) {
  const m = nom === "mentor", g = nom === "maqsad", z = nom === "tizim";
  $("#mentor-ekran").classList.toggle("yashirin", !m);
  $("#maqsad-ekran").classList.toggle("yashirin", !g);
  $("#tizim-ekran").classList.toggle("yashirin", !z);
  $("#oqim").classList.toggle("yashirin", m || g || z);
  $("#yozish-quti").classList.toggle("yashirin", m || g || z);
  if (!g) maqsadTaymerToxtat();
  if (!z) tzTaymerToxtat();
}

function mentorTugmaChiz() {
  const t = $("#mentor-tug"), b = $("#mentor-belgi");
  if (!MENTOR || !MENTOR.kurs) { t.classList.add("yashirin"); return; }
  t.classList.remove("yashirin");
  const ochiq = (MENTOR.vazifalar || []).filter(function (v) {
    return v.holat === "berildi"; }).length;
  b.classList.toggle("yashirin", !ochiq);
  b.textContent = ochiq ? String(ochiq) : "";
}

async function mentorYangila() {
  try {
    MENTOR = await api.ol("/api/mentor?twin_id=" + (JORIY_TWIN ? JORIY_TWIN.id : 0));
    mentorTugmaChiz();
  } catch (e) { /* mentor yo'q bo'lsa chat baribir ishlaydi */ }
  return MENTOR;
}

function mentorOch(manzilsiz) {
  JORIY = null;
  if (!manzilsiz && location.hash !== "#/mentor") location.hash = "#/mentor";
  ekran("mentor");
  $("#bosh-sarlavha").textContent = "O'quv rejam";
  tarixChiz();
  yon.yop();
  return UI.holat.yur($("#mentor-tan"), function () {
    return api.ol("/api/mentor?twin_id=" + (JORIY_TWIN ? JORIY_TWIN.id : 0));
  }, mentorChiz, { yuklanmoqda: "O'quv rejangiz yuklanmoqda...",
                   boshmi: function () { return false; } });
}

function mentorChiz(d, el) {
  MENTOR = d; mentorTugmaChiz();
  const nom = (d.twin && d.twin.nom) || "Ustoz";

  if (!d.kurs) {
    UI.holat.bosh(el, { ikon: "🎓", sarlavha: "O'quv dasturi hali tayyor emas",
      tan: "«" + nom + "» uchun o'quv dasturi hali tuzilmagan. Tayyor bo'lgach " +
           "shu yerda shaxsiy rejangiz paydo bo'ladi. Hozircha savollaringizni " +
           "chatda bering.",
      amal: { nom: "Chatga qaytish", onclick: function () { boshSahna(); } } });
    return;
  }
  if (!d.reja) {
    const q = h("div.karta", h("div.karta-ich.markaz", { style: "padding:34px 24px" },
      h("div", { style: "font-size:34px" }, "🎓"),
      h("h2", { style: "margin:12px 0 8px" }, "«" + nom + "» bilan o'qishni boshlaymiz"),
      h("div.izoh", { style: "max-width:440px;margin:0 auto 20px" },
        "Avval qisqa test: nimalarni allaqachon bilishingizni aniqlaymiz va " +
        (d.mavzu_soni ? d.mavzu_soni + " ta mavzudan " : "") +
        "faqat sizga keraklisidan reja tuzamiz. Test bepul va 2-3 daqiqa vaqt oladi."),
      h("div.qator", { style: "justify-content:center" },
        h("button.tug.asosiy.katta", { type: "button",
          onclick: function () { diagnostikaOch(); } }, "Testni boshlash"),
        h("button.tug.shaffof", { type: "button", onclick: function () {
          rejaYubor({ otkaz: true }, null); } }, "Testsiz boshlash"))));
    el.appendChild(q);
    return;
  }

  // --- umumiy progress
  const p = d.progress || { foiz: 0, tugagan: 0, jami: 0 };
  const joriy = _mavzuTop(d, d.joriy_mavzu);
  el.appendChild(h("div.karta.bolim-oraliq", h("div.karta-ich",
    h("div.qator.orash",
      h("div.halqa.katta-h", { style: "--f:" + p.foiz }, h("span", p.foiz + "%")),
      h("div", { style: "flex:1;min-width:180px" },
        h("h2", "O'quv rejangiz"),
        h("div.izoh", { style: "margin-top:3px" },
          p.tugagan + " / " + p.jami + " mavzu tugallandi" +
          (joriy ? " · hozir: " + joriy.nom : " · reja tugadi 🎉"))),
      joriy ? h("button.tug.asosiy", { type: "button",
        onclick: function () { mavzuPanel(joriy); } }, "Davom etish") : null))));

  // --- ochiq vazifalar
  const ochiq = (d.vazifalar || []).filter(function (v) {
    return v.holat !== "tekshirildi" || (v.baho != null && v.baho < 70); });
  if (ochiq.length) {
    el.appendChild(h("div.bolim-bosh", h("h2", "📝 Uy vazifalari")));
    ochiq.slice(0, 6).forEach(function (v) {
      el.appendChild(h("div.karta.bolim-oraliq", { style: "margin-bottom:10px" },
        h("div.karta-ich", h("div.qator.orash",
          h("div", { style: "flex:1;min-width:170px" },
            h("div", { style: "font-weight:600" }, v.mavzu),
            h("div.izoh", { style: "margin-top:3px" }, _vazifaIzoh(v))),
          h("button.tug" + (v.holat === "berildi" ? ".asosiy" : ""), { type: "button",
            onclick: function () { vazifaOch(v.id); } },
            v.holat === "berildi" ? "Topshirish"
              : v.holat === "tekshirilmoqda" ? "Holatni ko'rish" : "Natijani ko'rish")))));
    });
  }

  // --- modullar
  el.appendChild(h("div.bolim-bosh", h("h2", "Dastur")));
  (d.modullar || []).forEach(function (m) {
    const foiz = m.jami ? Math.round(m.tugagan * 100 / m.jami) : 0;
    const k = h("div.karta.modul-k",
      h("div.modul-bosh",
        h("div.halqa", { style: "--f:" + foiz }, h("span", foiz + "%")),
        h("div.ich", h("div.nom", m.nom),
          h("div.izoh", { style: "margin-top:2px" },
            m.tugagan + "/" + m.jami + " mavzu" + (m.tavsif ? " · " + m.tavsif : "")))));
    m.mavzular.forEach(function (s) {
      const b = M_HOLAT[s.holat] || M_HOLAT.kutmoqda;
      const yopiq = s.holat === "kutmoqda";
      k.appendChild(h("button.mavzu-q" + (s.holat === "joriy" ? ".joriy-m" : ""), {
        type: "button", disabled: yopiq ? "" : null,
        onclick: function () { if (!yopiq) mavzuPanel(s); },
      },
        h("span.kv" + (b.sinf ? "." + b.sinf : ""), b.kv),
        h("span.ich", h("span.nm", s.nom), h("span.tv", b.nom))));
    });
    el.appendChild(k);
  });
}

function _vazifaIzoh(v) {
  if (v.holat === "tekshirilmoqda") return "Tekshirilmoqda...";
  if (v.holat === "tekshirildi") {
    return "Baho: " + v.baho + " / 100" +
      (v.baho < 70 ? " — qayta topshirish mumkin" : "");
  }
  if (!v.muddat) return "Topshirilmagan";
  const kun = Math.ceil((new Date(v.muddat) - Date.now()) / 86400000);
  return kun < 0 ? "Muddati " + (-kun) + " kun oldin tugagan"
       : kun === 0 ? "Muddati bugun tugaydi" : "Muddatiga " + kun + " kun qoldi";
}

function _mavzuTop(d, mid) {
  if (!mid) return null;
  let topilgan = null;
  (d.modullar || []).forEach(function (m) {
    m.mavzular.forEach(function (s) { if (s.id === mid) topilgan = s; });
  });
  return topilgan;
}

/* --- boshlang'ich diagnostika ------------------------------------------- */
async function diagnostikaOch() {
  let d;
  try {
    d = await api.ol("/api/mentor/diagnostika?twin_id=" +
                     (JORIY_TWIN ? JORIY_TWIN.id : 0));
  } catch (e) { xatoToast(e); return; }
  const savollar = d.savollar || [];
  if (!savollar.length) {
    toast("Test savollari topilmadi — testsiz boshlaymiz", "xato");
    rejaYubor({ otkaz: true }, null); return;
  }
  const javoblar = {};
  let n = 0;

  const progress = h("div.tn-progress", h("i"));
  const ich = h("div");
  const tan = h("div", progress, ich);

  function chiz() {
    const s = savollar[n];
    progress.firstChild.style.width = Math.round(n * 100 / savollar.length) + "%";
    ich.innerHTML = "";
    ich.appendChild(h("div.izoh", { style: "margin-bottom:4px" },
      (n + 1) + " / " + savollar.length + " · " + s.modul));
    ich.appendChild(h("h3", { style: "margin-bottom:12px" }, s.savol));
    (s.javoblar || []).forEach(function (j) {
      ich.appendChild(h("button.test-v" +
        (javoblar[s.mavzu_id] === j.kod ? ".tanlangan" : ""), {
        type: "button",
        onclick: function () { javoblar[s.mavzu_id] = j.kod; keyingi(); },
      }, h("span.kod", j.kod), h("span", j.matn)));
    });
    ich.appendChild(h("div.qator", { style: "margin-top:16px" },
      n > 0 ? h("button.tug.shaffof", { type: "button",
        onclick: function () { n--; chiz(); } }, "← Orqaga") : null,
      h("button.tug.shaffof.osdi", { type: "button", onclick: keyingi },
        n === savollar.length - 1 ? "Yakunlash" : "Bilmayman →")));
  }

  function keyingi() {
    if (n < savollar.length - 1) { n++; chiz(); return; }
    rejaYubor({ javoblar: javoblar }, oyna);
  }

  const oyna = modal({ sarlavha: "Bilim darajangizni aniqlaymiz", tan: tan,
    amallar: [{ nom: "Testsiz boshlash", uslub: "shaffof", yopmasin: true,
      onclick: function () { rejaYubor({ otkaz: true }, oyna); return false; } }] });
  chiz();
}

async function rejaYubor(tan, oyna) {
  const t = Object.assign({ twin_id: JORIY_TWIN ? JORIY_TWIN.id : null }, tan);
  try {
    const r = await api.yubor("/api/mentor/diagnostika", t);
    if (oyna) oyna.yop();
    MENTOR = r.manzara;
    const n = r.natija || {};
    toast(n.otkazilgan
      ? n.otkazilgan + " ta mavzuni allaqachon bilar ekansiz — o'tkazib yubordik"
      : "Reja tayyor — o'qishni boshlaymiz", "ok");
    mentorOch();
  } catch (e) { xatoToast(e); }
}

/* --- mavzu paneli ------------------------------------------------------- */
function mavzuPanel(s) {
  const tan = h("div");
  if (s.tavsif) tan.appendChild(h("div", { style: "line-height:1.65" }, s.tavsif));
  if ((s.maqsadlar || []).length) {
    tan.appendChild(h("div.izoh", { style: "margin:14px 0 6px;font-weight:600" },
      "Bu darsdan keyin siz:"));
    const u = h("ul", { style: "margin:0;padding-left:20px;line-height:1.7" });
    s.maqsadlar.forEach(function (m) { u.appendChild(h("li", m)); });
    tan.appendChild(u);
  }
  const b = M_HOLAT[s.holat] || M_HOLAT.kutmoqda;
  tan.appendChild(h("div.qator", { style: "margin-top:16px" },
    h("span.belgi" + (s.holat === "joriy" ? ".urgu-b" :
      s.holat === "vazifada" ? ".kok-b" :
      s.holat === "kutmoqda" ? "" : ".yashil-b"), b.nom),
    s.bolak_soni ? h("span.izoh", s.bolak_soni + " ta dars materiali") : null));

  const amallar = [];
  const tugadi = ["tugallangan", "otkazilgan", "majburan_otildi"].indexOf(s.holat) >= 0;
  amallar.push({ nom: s.suhbat_id ? "Darsni davom ettirish" : "Darsni boshlash",
    uslub: tugadi ? "" : "asosiy",
    onclick: function () { darsOch(s); } });
  /* Mavzuda test savoli bo'lmasa ham o'quvchi oldinga o'ta olishi shart —
     aks holda o'sha mavzuda qulflanib qolardi. */
  if (s.suhbat_id && !tugadi) {
    amallar.push(s.test_soni
      ? { nom: "✓ Tushunganimni tekshirish", onclick: function () { testOch(s.id); } }
      : { nom: "✓ Mavzuni tugatdim", onclick: function () { mavzuYakunla(s); } });
  }
  if (s.holat === "vazifada") {
    const v = (MENTOR.vazifalar || []).find(function (x) {
      return x.mavzu_id === s.id; });
    if (v) amallar.push({ nom: "📝 Uy vazifasi", uslub: "asosiy",
      onclick: function () { vazifaOch(v.id); } });
  }
  modal({ sarlavha: s.nom, tan: tan, amallar: amallar });
}

async function darsOch(s) {
  let r;
  try { r = await api.yubor("/api/mentor/dars", { mavzu_id: s.id }); }
  catch (e) { xatoToast(e); return; }
  $$(".parda").forEach(function (p) { p.remove(); });
  document.body.style.overflow = "";
  await suhbatlarYangila();
  await suhbatOch(r.suhbat_id);
  if (r.yangi) yubor(null, { matn: r.boshlash, yashirin: true });
}

/** Testsiz mavzuni yakunlash (savol yaratilmagan mavzular uchun). */
async function mavzuYakunla(s) {
  try {
    const r = await api.yubor("/api/mentor/test",
      { mavzu_id: s.id, javoblar: {} });
    if (r.manzara) { MENTOR = r.manzara; mentorTugmaChiz(); }
    $$(".parda").forEach(function (p) { p.remove(); });
    document.body.style.overflow = "";
    if (r.vazifa) { vazifaOch(r.vazifa.id); return; }
    toast("Mavzu tugallandi — keyingisi ochildi", "ok");
    mentorOch(true);
  } catch (e) { xatoToast(e); }
}

/* --- mini-test ---------------------------------------------------------- */
async function testOch(mavzuId) {
  let d;
  try { d = await api.ol("/api/mentor/test?mavzu_id=" + mavzuId); }
  catch (e) { xatoToast(e); return; }
  const savollar = d.savollar || [];
  if (!savollar.length) { toast("Bu mavzuda test savoli yo'q", "xato"); return; }
  const javoblar = {};
  const ich = h("div");
  const tan = h("div",
    h("div.izoh", { style: "margin-bottom:14px" },
      "Qisqa tekshiruv: " + savollar.length + " ta savol. Yarmidan ko'pini " +
      "to'g'ri javob bersangiz uy vazifasiga o'tamiz."),
    ich);

  function chiz() {
    ich.innerHTML = "";
    savollar.forEach(function (s) {
      ich.appendChild(h("div", { style: "margin-bottom:18px" },
        h("div", { style: "font-weight:600;margin-bottom:8px;line-height:1.5" }, s.savol)));
      const oxirgi = ich.lastChild;
      (s.javoblar || []).forEach(function (j) {
        oxirgi.appendChild(h("button.test-v" +
          (javoblar[s.n] === j.kod ? ".tanlangan" : ""), {
          type: "button",
          onclick: function () { javoblar[s.n] = j.kod; chiz(); },
        }, h("span.kod", j.kod), h("span", j.matn)));
      });
    });
  }
  chiz();

  const oyna = modal({ sarlavha: "Tushunganingizni tekshiramiz", tan: tan, keng: true,
    amallar: [
      { nom: "Keyinroq", uslub: "shaffof" },
      { nom: "Javoblarni yuborish", uslub: "asosiy", yopmasin: true,
        onclick: async function (e, b) {
          if (Object.keys(javoblar).length < savollar.length) {
            toast("Barcha savollarga javob bering", "xato"); return false;
          }
          try {
            const r = await api.yubor("/api/mentor/test",
              { mavzu_id: mavzuId, javoblar: javoblar });
            b.yop();
            if (r.manzara) { MENTOR = r.manzara; mentorTugmaChiz(); }
            testNatija(r, mavzuId);
          } catch (x) { xatoToast(x); }
          return false;
        } },
    ] });
}

function testNatija(r, mavzuId) {
  const n = r.natija;
  const tan = h("div");
  tan.appendChild(h("div.baho-quti",
    h("div.baho-raqam" + (n.otdi ? ".otdi-b" : ".yiqildi-b"),
      n.togri + "/" + n.jami),
    h("div", h("div", { style: "font-weight:600" },
      n.otdi ? "Ajoyib — mavzuni o'zlashtiribsiz" : "Bir oz takrorlash kerak"),
      h("div.izoh", { style: "margin-top:3px" }, n.otdi
        ? (r.vazifa ? "Endi amaliy vazifa bilan mustahkamlaymiz."
                    : "Mavzu tugallandi, keyingisi ochildi.")
        : "Darsga qayting va savol bering — keyin qayta urinib ko'ring."))));

  (n.savollar || []).forEach(function (s) {
    if (s.ok) return;
    tan.appendChild(h("div.fikr-k.xato-f",
      h("div.bosh", s.savol),
      h("div", "To'g'ri javob: " + String(s.togri).toUpperCase() +
        (s.izoh ? " — " + s.izoh : ""))));
  });

  const mentordamiz = /^#\/mentor\b/.test(location.hash || "");
  const amallar = [{ nom: "Yopish", uslub: "shaffof",
    onclick: function () { if (mentordamiz) mentorOch(true); } }];
  if (r.vazifa) {
    amallar.push({ nom: "📝 Vazifani ochish", uslub: "asosiy",
      onclick: function () { vazifaOch(r.vazifa.id); } });
  } else if (!n.otdi) {
    amallar.push({ nom: "Qayta urinish",
      onclick: function () { testOch(mavzuId); } });
  }
  modal({ sarlavha: "Test natijasi", tan: tan, amallar: amallar, keng: true });
}

/* --- uy vazifasi -------------------------------------------------------- */
let VAZIFA_TAYMER = null;

async function vazifaOch(vid) {
  const joy = h("div");
  const oyna = modal({ sarlavha: "Uy vazifasi", tan: joy, keng: true,
    yopilganda: function () {
      if (VAZIFA_TAYMER) { clearTimeout(VAZIFA_TAYMER); VAZIFA_TAYMER = null; }
    } });
  await vazifaChiz(joy, vid, oyna);
}

async function vazifaChiz(joy, vid, oyna) {
  UI.holat.yuklanmoqda(joy, "Vazifa yuklanmoqda...");
  let v;
  try { v = await api.ol("/api/vazifa/" + vid); }
  catch (e) { UI.holat.xato(joy, e); return; }
  joy.innerHTML = "";

  joy.appendChild(h("div", { style: "font-weight:600;margin-bottom:6px" }, v.mavzu || ""));
  joy.appendChild(h("div", { style: "line-height:1.7;white-space:pre-wrap" }, v.topshiriq));

  if ((v.rubrika || []).length) {
    const d = h("details", { style: "margin-top:14px" });
    d.appendChild(h("summary", { style: "cursor:pointer;font-size:13px;color:var(--xira)" },
      "Qanday baholanadi?"));
    const u = h("div", { style: "margin-top:10px" });
    v.rubrika.forEach(function (r) {
      u.appendChild(h("div.mezon-q",
        h("div.qator", h("span", { style: "font-weight:600" }, r.nom),
          h("span.ball", r.ball + " ball")),
        r.izoh ? h("div.izoh", r.izoh) : null));
    });
    d.appendChild(u);
    joy.appendChild(d);
  }

  if (v.holat === "tekshirilmoqda") {
    joy.appendChild(h("div.jonli", { style: "margin-top:18px" }, h("div.aylanma"),
      h("span", "Ustoz javobingizni tekshirmoqda — bir daqiqacha vaqt oladi...")));
    VAZIFA_TAYMER = setTimeout(function () { vazifaChiz(joy, vid, oyna); }, 5000);
    return;
  }

  if (v.holat === "tekshirildi" && v.tekshiruv && v.tekshiruv.mezonlar) {
    joy.appendChild(h("hr"));
    joy.appendChild(fikrChiz(v));
  }

  if (v.qayta_mumkin) {
    const maydon = h("textarea", { style: "min-height:170px",
      placeholder: "Javobingizni shu yerga yozing...",
      "aria-label": "Vazifa javobi", maxlength: "8000" });
    maydon.value = v.holat === "tekshirildi" ? "" : (v.javob || "");
    joy.appendChild(h("div", { style: "margin-top:18px" },
      h("label.yorliq", v.holat === "tekshirildi"
        ? "Tuzatilgan javobingiz (" + (v.urinish + 1) + "-urinish, " +
          v.maks_urinish + " tadan)" : "Javobingiz"),
      maydon,
      h("div.qator", { style: "margin-top:10px" },
        h("button.tug.asosiy", { type: "button", onclick: async function (e) {
          e.target.disabled = true;
          try {
            await api.yubor("/api/vazifa/" + vid + "/topshir",
              { javob: maydon.value });
            toast("Topshirildi — tekshirilmoqda", "ok");
            await vazifaChiz(joy, vid, oyna);
            mentorYangila();
          } catch (x) { xatoToast(x); e.target.disabled = false; }
        } }, "Topshirish"),
        h("span.izoh.osdi", v.muddat ? _vazifaIzoh(v) : ""))));
  } else if (v.holat === "tekshirildi") {
    joy.appendChild(h("div.qator", { style: "margin-top:16px" },
      h("button.tug", { type: "button", onclick: function () {
        oyna.yop(); mentorOch(); } }, "O'quv rejaga qaytish")));
  }
}

function fikrChiz(v) {
  const t = v.tekshiruv || {};
  const q = h("div");
  q.appendChild(h("div.baho-quti",
    h("div.baho-raqam" + (v.baho >= v.otish_ball ? ".otdi-b" : ".yiqildi-b"), v.baho),
    h("div", h("div", { style: "font-weight:600" },
      v.baho >= v.otish_ball ? "Qabul qilindi" : "Yana ishlash kerak"),
      h("div.izoh", { style: "margin-top:3px;line-height:1.6" }, t.xulosa || ""))));

/* ====================================================== maqsad halqasi
   Sikl: maqsad -> tahlil -> reja -> harakat -> natija -> yangi sikl.
   Bu yerda faqat KO'RINISH: barcha qarorlar (qadam yopilishi, foiz, sikl
   yakuni) serverda qabul qilinadi, UI ularni ko'rsatadi va tugma beradi. */
let MAQSAD = null;
let MAQSAD_TAYMER = null;
const MAQSAD_KUTISH = ["reja_kutilmoqda", "yakun_kutilmoqda"];

const Q_HOLAT = {
  bajarildi: { kv: "✓", sinf: "tugadi-k", nom: "Bajarildi" },
  otkazildi: { kv: "»", sinf: "otildi-k", nom: "O'tkazib yuborildi" },
  joriy:     { kv: "▶", sinf: "joriy-k",  nom: "Hozir shu ustida ishlaymiz" },
  kutmoqda:  { kv: "○", sinf: "",         nom: "Navbatda" },
};

function maqsadTaymerToxtat() {
  if (MAQSAD_TAYMER) { clearTimeout(MAQSAD_TAYMER); MAQSAD_TAYMER = null; }
}

function maqsadTugmaChiz() {
  const t = $("#maqsad-tug"), b = $("#maqsad-belgi");
  if (!MAQSAD || MAQSAD.yoq) { t.classList.add("yashirin"); return; }
  t.classList.remove("yashirin");
  const m = MAQSAD.maqsad;
  const kechikkan = m && m.ochiq && (m.qadamlar || []).some(function (q) {
    return q.holat === "joriy" && q.muddat &&
           new Date(q.muddat).getTime() < Date.now() - 86400000;
  });
  const kut = m && m.ochiq && MAQSAD_KUTISH.indexOf(m.holat) >= 0;
  b.classList.toggle("yashirin", !(kechikkan || kut));
  b.textContent = kut ? "…" : kechikkan ? "!" : "";
}

async function maqsadYangila() {
  try {
    MAQSAD = await api.ol("/api/maqsad?twin_id=" + (JORIY_TWIN ? JORIY_TWIN.id : 0));
  } catch (e) {
    MAQSAD = { yoq: true };   /* rejim o'chiq — bo'lim ko'rinmaydi */
  }

}

function maqsadOch(manzilsiz) {
  JORIY = null;
  if (!manzilsiz && location.hash !== "#/maqsad") location.hash = "#/maqsad";
  ekran("maqsad");
  $("#bosh-sarlavha").textContent = "Maqsadim";

  yon.yop();

    return api.ol("/api/maqsad?twin_id=" + (JORIY_TWIN ? JORIY_TWIN.id : 0));

                   boshmi: function () { return false; } });
}

/* --- halqa (BTM metodikasi 10 bosqichi) --------------------------------- */
function _mqNuqta(r, burchak) {
  const rad = (burchak - 90) * Math.PI / 180;
  return [150 + r * Math.cos(rad), 150 + r * Math.sin(rad)];
}

function _mqYoy(r, a1, a2) {
  const p1 = _mqNuqta(r, a1), p2 = _mqNuqta(r, a2);
  return "M " + p1[0].toFixed(1) + " " + p1[1].toFixed(1) + " A " + r + " " + r +
         " 0 0 1 " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
}

/** Halqa: har segment — metodikaning bitta bosqichi, reja qadamlari
 *  shu bosqichlarga teglangan (server oq ro'yxatdan tekshirgan). */
function maqsadHalqa(d, m) {
  const R = 126, ORALIQ = 3.4;
  const holat = {};
  (m.qadamlar || []).forEach(function (q) {
    if (!q.metodika) return;
    const s = holat[q.metodika] ||
      (holat[q.metodika] = { bor: 0, tugadi: 0, joriy: false });
    s.bor++;
    if (q.holat === "bajarildi" || q.holat === "otkazildi") s.tugadi++;
    if (q.holat === "joriy") s.joriy = true;
  });

  let ich = "";
  (d.metodika || []).forEach(function (t, i) {
    const s = holat[t.kod] || { bor: 0, tugadi: 0, joriy: false };
    let kod = "";
    if (s.joriy) kod = " joriy";
    else if (s.bor && s.tugadi === s.bor) kod = " tugadi";
    else if (s.bor) kod = " bor";
    const a1 = i * 36 + ORALIQ / 2, a2 = (i + 1) * 36 - ORALIQ / 2;
    const p = _mqNuqta(R, (a1 + a2) / 2);
    ich += '<path class="mq-yoy' + kod + '" d="' + _mqYoy(R, a1, a2) + '"><title>' +
      esc(t.n + ". " + t.nom + (s.bor ? " — " + s.bor + " qadam" : "")) +
      '</title></path>' +
      '<text class="mq-raqam' + kod + '" x="' +
      p[0].toFixed(1) + '" y="' + p[1].toFixed(1) + '">' + t.n + "</text>";
  });

  const foiz = m.foiz || 0;
  const quti = h("div.mq-halqa", {
    html: '<svg viewBox="0 0 300 300" class="mq-svg" role="img" ' +
          'aria-label="Maqsad halqasi: ' + esc(foiz + " foiz") + '">' +
          ich + "</svg>" });
  quti.appendChild(h("div.mq-markaz",
    h("div.mq-foiz", foiz + "%"),
    h("div.mq-nom", m.sarlavha || "Maqsad"),
    h("div.mq-tag", _mqBosqichNomi(d, m))));
  return quti;
}

function _mqBosqichNomi(d, m) {
  const b = (d.bosqichlar || []).find(function (x) { return x.kod === m.holat; });
  if (m.holat === "bekor") return "Bekor qilingan";
  return b ? b.n + "/6 · " + b.nom : "";
}

/* --- bosqich chizig'i (mahsulot sikli) ---------------------------------- */
function bosqichChiz(d, m) {
  const q = h("div.mq-stepper");
  (d.bosqichlar || []).forEach(function (b) {
    const holat = m.holat === "bekor" ? "" :
      b.n < m.bosqich ? "tugadi" : b.n === m.bosqich ? "joriy" : "";
    q.appendChild(h("div.mq-qadam-b" + (holat ? "." + holat : ""),
      h("span.n", b.n < m.bosqich ? "✓" : String(b.n)),
      h("span.nm", b.nom)));
  });
  return q;
}

/* --- asosiy chizuvchi --------------------------------------------------- */
function maqsadChiz(d, el) {
  MAQSAD = d; maqsadTugmaChiz(); maqsadTaymerToxtat();
  const nom = (d.twin && d.twin.nom) || "Ustoz";
  const m = d.maqsad;

  if (!m) { maqsadBoshQadam(d, el, nom); return; }

  el.appendChild(h("div.karta.bolim-oraliq", h("div.karta-ich",
    h("div.qator.orash", { style: "align-items:flex-start;gap:20px" },
      maqsadHalqa(d, m),
      h("div", { style: "flex:1;min-width:210px" },
        h("h2", m.sarlavha || "Maqsad"),
        (m.tafsilot || {}).matn
          ? h("div.izoh", { style: "margin-top:5px;line-height:1.6" },
              m.tafsilot.matn) : null,
        (m.tafsilot || {}).olchov
          ? h("div.izoh", { style: "margin-top:7px" },
              h("b", "O'lchov: "), m.tafsilot.olchov) : null,
        bosqichChiz(d, m))))));

  if (m.holat === "intervyu") maqsadIntervyu(d, m, el);
  else if (m.holat === "reja_kutilmoqda") maqsadKutish(d, el,
    "Reja tuzilmoqda", "Ustoz maqsadingizni tahlil qilib, qadamlarni " +
    "tayyorlayapti — bu bir daqiqacha vaqt oladi.");
  else if (m.holat === "reja_qoralama") maqsadQoralama(d, m, el);
  else if (m.holat === "faol") maqsadHarakat(d, m, el);
  else if (m.holat === "yakun_kutilmoqda") maqsadKutish(d, el,
    "Natija tahlil qilinmoqda", "Ustoz siklingizni ko'rib chiqib, xulosa va " +
    "keyingi qadam uchun takliflar tayyorlayapti.");
  else maqsadYakun(d, m, el);

  if ((d.tarix || []).length) maqsadTarix(d, el);
}

function maqsadBoshQadam(d, el, nom) {
  el.appendChild(h("div.karta", h("div.karta-ich.markaz", { style: "padding:34px 24px" },
    h("div", { style: "font-size:36px" }, "🎯"),

function qadamlarChiz(d, m, tahrir) {
  const teglar = {};
  (d.metodika || []).forEach(function (t) { teglar[t.kod] = t; });
  const quti = h("div.karta.modul-k");
  (m.qadamlar || []).forEach(function (q, i) {
    const b = Q_HOLAT[q.holat] || Q_HOLAT.kutmoqda;
    const t = teglar[q.metodika];
    const ich = h("span.ich",
      h("span.nm", (i + 1) + ". " + q.nom),
      h("span.tv", [
        b.nom,
        /* Yopilgan qadamda ish sanog'i chalkashtiradi — faqat ochiqlarida */
        (q.ish_jami && (q.holat === "joriy" || q.holat === "kutmoqda"))
          ? q.ish_bajarildi + "/" + q.ish_jami + " ish" : null,
        q.muddat ? _mqMuddat(q) : null,
        q.umumiy ? "umumiy tavsiya" : null,
      ].filter(Boolean).join(" · ")));
    const qator = h("div.mavzu-q" + (q.holat === "joriy" ? ".joriy-m" : ""),
      h("span.kv" + (b.sinf ? "." + b.sinf : ""), b.kv), ich);
    if (t) qator.appendChild(h("span.mq-teg", { title: t.nom }, t.kv + " " + t.n));
    if (tahrir) {
      qator.appendChild(h("span.tug-ikon", { role: "button", tabindex: "0",
        title: "Tahrirlash", "aria-label": "Qadamni tahrirlash",
        onclick: function () { qadamTahrirOyna(q, m); } }, "✎"));
    } else {
      qator.addEventListener("click", function () { qadamPanel(q, m); });
      qator.style.cursor = "pointer";
    }
    quti.appendChild(qator);
  });
  return quti;
}

/** Qadam ichidagi aniq ishlar — belgilanadigan ro'yxat.
 *  `tahrir` = joriy qadam (belgilash va qo'shish mumkin). */
function ishlarChiz(q, tahrir) {
  const ishlar = q.ishlar || [];
  const quti = h("div.ish-quti");
  const bajarildi = ishlar.filter(function (i) { return i.bajarildi; }).length;

  quti.appendChild(h("div.qator", { style: "margin-bottom:8px" },
    h("div.yorliq-k", { style: "margin:0" }, "Aniq ishlar"),
    ishlar.length ? h("span.izoh.osdi",
      bajarildi + " / " + ishlar.length + " bajarildi") : null));

  if (!ishlar.length) {
    quti.appendChild(h("div.izoh", { style: "margin-bottom:8px" },
      "Bu qadamga hali ish qo'shilmagan — o'zingiz qo'shishingiz mumkin."));
  }

  ishlar.forEach(function (i) {
    const belgi = h("button.ish-belgi" + (i.bajarildi ? ".bajarildi" : ""), {
      type: "button", "aria-pressed": i.bajarildi ? "true" : "false",
      "aria-label": (i.bajarildi ? "Bajarilmagan deb belgilash: "
                                 : "Bajarildi deb belgilash: ") + i.matn,
      disabled: tahrir ? null : "",
      onclick: function () { ishBelgi(i, !i.bajarildi); },
    }, i.bajarildi ? "✓" : "");
    const qator = h("div.ish-q" + (i.bajarildi ? ".bajarildi-i" : ""), belgi,
      h("div.ich",
        h("div.nm", i.matn),
        i.izoh ? h("div.izoh", i.izoh) : null));
    if (tahrir && i.ozim) {
      qator.appendChild(h("span.tug-ikon", { role: "button", tabindex: "0",
        title: "O'chirish", "aria-label": "Ishni o'chirish",
        onclick: function () { ishOchir(i); } }, "✕"));
    }
    quti.appendChild(qator);
  });

  if (tahrir) {
    const kirit = h("input", { type: "text", maxlength: "300",
      placeholder: "O'z ishingizni qo'shing...", "aria-label": "Yangi ish" });
    kirit.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); ishQosh(q, kirit); }
    });
    quti.appendChild(h("div.qator", { style: "margin-top:10px" }, kirit,
      h("button.tug.kichik-t", { type: "button",
        onclick: function () { ishQosh(q, kirit); } }, "✚")));
  }
  return quti;
}

async function ishBelgi(i, bajarildi) {
  try {
    const r = await api.yubor("/api/maqsad/ish/" + i.id,
                              { bajarildi: bajarildi });
    if (bajarildi && r.qolgan_ish === 0) {
      toast("Barcha ishlar bajarildi — qadamni yopishingiz mumkin", "ok");
    }
    maqsadOch(true);
  } catch (e) { xatoToast(e); }
}

async function ishQosh(q, kirit) {
  const matn = (kirit.value || "").trim();
  if (!matn) return;
  try {
    await api.yubor("/api/maqsad/qadam/" + q.id + "/ish", { matn: matn });
    kirit.value = "";
    maqsadOch(true);
  } catch (e) { xatoToast(e); }
}

async function ishOchir(i) {
  try {
    await api.ochir("/api/maqsad/ish/" + i.id);
    maqsadOch(true);
  } catch (e) { xatoToast(e); }
}

function _mqMuddat(q) {
  if (q.holat === "bajarildi" || q.holat === "otkazildi") return "";
  const kun = Math.ceil((new Date(q.muddat) - Date.now()) / 86400000);
  return kun < 0 ? "muddati " + (-kun) + " kun oldin tugagan"
       : kun === 0 ? "muddati bugun" : "muddatiga " + kun + " kun";
}

function qadamPanel(q, m) {
  const tan = h("div");
  if (q.nima_uchun) tan.appendChild(h("div", { style: "line-height:1.7" }, q.nima_uchun));
  if (q.mezon) tan.appendChild(_kartaBlok("Tayyor deb hisoblaymiz, agar", q.mezon));
  if ((q.ishlar || []).length) tan.appendChild(ishlarChiz(q, q.holat === "joriy"));
  if (q.dalil) tan.appendChild(_kartaBlok(
    q.holat === "otkazildi" ? "O'tkazib yuborish sababi" : "Siz yozgan natija",
    q.dalil));

      "Bu qadam ustozning yuklangan darslarida yoritilmagan — umumiy " +
      "bilimga tayanadi."));

  const amallar = [];
  if (q.holat === "joriy") {
    amallar.push({ nom: "✓ Bajardim", uslub: "asosiy",

    amallar.push({ nom: "O'tkazib yuborish",

  const y = m.yakun || {};
  const o = m.olcham || {};
  const bekormi = m.holat === "bekor";

  el.appendChild(h("div.karta.bolim-oraliq", h("div.karta-ich",

        h("div.izoh", { style: "margin-top:3px;line-height:1.6" },
          o.bajarildi + " / " + o.jami + " qadam bajarildi" +
          (o.otkazildi ? " · " + o.otkazildi + " ta o'tkazib yuborildi" : "") +
          (o.muddatida ? " · " + o.muddatida + " tasi muddatida" : "")))),
    y.xulosa ? h("div", { style: "margin-top:14px;line-height:1.75" }, y.xulosa) : null,
    y.texnik_xato ? h("div.qator", { style: "margin-top:14px" },
      h("button.tug", { type: "button", onclick: function (e) {
        qaytaTahlil(m, e.target); } }, "↻ Qayta tahlil")) : null)));

  (y.yaxshi || []).forEach(function (x) {
    el.appendChild(h("div.fikr-k.kuchli-f", h("div.bosh", "✓ Yaxshi chiqdi"), x));
  });
  (y.choloq || []).forEach(function (x) {
    el.appendChild(h("div.fikr-k.xato-f", h("div.bosh", "✗ Cho'loq qoldi"), x));
  });
  (y.saboqlar || []).forEach(function (x) {
    el.appendChild(h("div.fikr-k.taklif-f", h("div.bosh", "↗ Saboq"), x));
  });

  /* Qadamlar ro'yxati yig'ilgan holda — foydalanuvchi nima qilganini va
     nimani o'tkazib yuborganini eslay olsin. */
  if ((m.qadamlar || []).length) {
    const yigma = h("details.bolim-oraliq", { style: "margin-top:22px" });
    yigma.appendChild(h("summary", {
      style: "cursor:pointer;font-weight:600;margin-bottom:10px" },

    yigma.appendChild(qadamlarChiz(d, m, false));
    el.appendChild(yigma);

  const takliflar = y.takliflar || [];
  el.appendChild(h("div.bolim-bosh", { style: "margin-top:26px" },
    h("h2", "Keyingi qadam")));
  if (takliflar.length) {
    el.appendChild(h("div.izoh", { style: "margin-bottom:12px" },
      "Ustoz shu yo'nalishlarni taklif qilyapti — birini tanlang yoki " +
      "o'z maqsadingizni yozing:"));
    takliflar.forEach(function (t, i) {
      el.appendChild(h("div.karta.taklif-k", h("div.karta-ich",
        h("div", { style: "font-weight:650;line-height:1.55" }, t.taklif),
        t.natija ? h("div.izoh", { style: "margin-top:7px;line-height:1.7" },

        t.umumiy ? h("div.izoh", { style: "margin-top:7px" },

          h("button.tug.asosiy", { type: "button", onclick: function (e) {
            maqsadTanla(m, i, e.target); } }, "Shu maqsadni olamiz")))));

    h("button.tug" + (takliflar.length ? "" : ".asosiy.katta"), { type: "button",
