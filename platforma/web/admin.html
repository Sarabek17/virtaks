<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Admin — Virtaks</title>
<link rel="stylesheet" href="/static/ui.css?v=2">
<script src="/static/ui.js?v=2"></script>
<style>
.kirish-ekran { position: fixed; inset: 0; z-index: 100; background: var(--fon);
  display: grid; place-items: center; padding: 20px; }
.kirish-karta { width: 100%; max-width: 380px; }
.logo-q { display: flex; align-items: center; gap: 9px; }
.logo-q .kv { width: 28px; height: 28px; border-radius: 8px; background: var(--urgu);
  color: var(--urgu-matn); display: grid; place-items: center;
  font: 700 12px/1 var(--shrift); flex: none; }
.diagramma { display: flex; align-items: flex-end; gap: 3px; height: 90px;
  padding: 8px 0; }
.diagramma .ustun-d { flex: 1; background: var(--urgu); border-radius: 3px 3px 0 0;
  min-height: 2px; opacity: .85; position: relative; }
.diagramma .ustun-d:hover { opacity: 1; }
.kod-blok { font: 12px/1.5 var(--shrift-kod); background: var(--yuza2);
  border: 1px solid var(--chiz); border-radius: var(--r-o); padding: 12px;
  max-height: 380px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.rang-namuna { width: 22px; height: 22px; border-radius: 6px; flex: none;
  border: 1px solid var(--chiz2); }
</style>
</head>
<body>

<div class="karkas yashirin" id="ilova">
  <aside class="yon" id="yon">
    <div class="yon-bosh">
      <div class="qator" style="margin-bottom:14px">
        <div class="logo-q"><span class="kv">V</span>
          <span style="font-weight:600;font-size:14.5px">Admin</span></div>
        <button class="tug-ikon osdi mobil-faqat" id="yon-yop" aria-label="Yopish">✕</button>
      </div>
    </div>
    <div class="yon-tan">
      <nav class="menyu" id="menyu" aria-label="Bo'limlar"></nav>
    </div>
    <div class="yon-oyoq">
      <div class="menyu">
        <a href="/">← Ilovaga qaytish</a>
        <button type="button" id="mavzu-tug">◐ Mavzu</button>
        <button type="button" id="chiqish-tug">⏻ Chiqish</button>
      </div>
      <div class="izoh" style="padding:8px 11px 0" id="kim"></div>
    </div>
  </aside>

  <main class="asos">
    <header class="asos-bosh">
      <button class="tug-ikon mobil-faqat" id="menyu-tug" aria-label="Menyu">☰</button>
      <h1 id="bolim-nom" style="font-size:16px">Xulosa</h1>
      <div class="osdi qator" id="bosh-amal"></div>
    </header>
    <div class="asos-tan"><div class="ich" id="tan"></div></div>
  </main>
</div>

<div class="kirish-ekran yashirin" id="kirish">
  <div class="kirish-karta">
    <div class="markaz" style="margin-bottom:18px">
      <div class="logo-q" style="justify-content:center"><span class="kv">V</span>
        <span style="font-weight:600">Admin panel</span></div>
    </div>
    <!-- Kirish faqat Telegram orqali — tarkibni tgKirishChiz() chizadi. -->
    <div class="karta"><div class="karta-ich" id="k-joy"></div></div>
  </div>
</div>

<script>
(function () {
"use strict";
const { $, $$, esc, h, api, toast, modal, xatoToast, jadval, holat } = UI;
const A = "/api/admin";
let KIM = null;

/* ================================================================ bo'limlar */
const BOLIMLAR = [
  { kod: "xulosa",     nom: "📊 Xulosa" },
  { kod: "twinlar",    nom: "🎓 Ustozlar" },
  { kod: "direktorlar",nom: "🏛 Direktorlar" },
  { kod: "userlar",    nom: "👥 Foydalanuvchilar" },
  { kod: "mentor",     nom: "🎓 Mentorlik" },
  { kod: "maqsad",     nom: "🎯 Maqsadlar" },
  { kod: "moliya",     nom: "💰 Moliya" },
  { kod: "rejalar",    nom: "🎫 Rejalar va obunalar" },
  { kod: "hamkorlar",  nom: "🤝 Hamkorlar (B2B)" },
  { kod: "jobs",       nom: "⚙ Fon-ishlar" },
  { kod: "sozlama",    nom: "🔧 Sozlamalar" },
];

function menyuChiz(faol) {
  const m = $("#menyu");
  m.innerHTML = "";
  BOLIMLAR.forEach(function (b) {
    m.appendChild(h("a" + (b.kod === faol ? ".faol" : ""),
      { href: "#/" + b.kod, "aria-current": b.kod === faol ? "page" : null }, b.nom));
  });
}

function sahifa(kod, nom, chizuvchi, amallar) {
  menyuChiz(kod);
  $("#bolim-nom").textContent = nom;
  const ba = $("#bosh-amal");
  ba.innerHTML = "";
  (amallar || []).forEach(function (a) { ba.appendChild(a); });
  const t = $("#tan");
  t.innerHTML = "";
  yon.yop();
  chizuvchi(t);
}

function tugma(nom, uslub, fn) {
  return h("button.tug" + (uslub ? "." + uslub : ""), { type: "button", onclick: fn }, nom);
}
function yangilaTug(fn) { return tugma("↻ Yangilash", "kichik-t", fn); }

/* ================================================================ 1. XULOSA */
const STAT_NOM = {
  userlar: "Foydalanuvchilar", twinlar: "Ustozlar", direktorlar: "Direktorlar",
  manbalar: "Bilim manbalari", bolaklar: "Bilim bo'laklari", majlislar: "Savol-javoblar",
  jobs_navbatda: "Navbatda", jobs_ketmoqda: "Bajarilmoqda", jobs_xato: "Xato joblar",
};

function xulosaChiz(el) {
  holat.yur(el, function () { return api.ol(A + "/xulosa"); }, function (d, joy) {
    const tor = h("div.stat-tor");
    Object.keys(STAT_NOM).forEach(function (k) {
      tor.appendChild(h("div.stat",
        h("div.qiymat", String(d[k] == null ? "—" : d[k])),
        h("div.nom", STAT_NOM[k])));
    });
    tor.appendChild(h("div.stat",
      h("div.qiymat", UI.pul(d.narx_jami)), h("div.nom", "LLM xarajati (jami)")));
    joy.appendChild(tor);

    if (d.jobs_xato > 0) {
      joy.appendChild(h("div.karta", { style: "margin-top:18px;border-color:var(--qizil)" },
        h("div.karta-ich",
          h("div.qator", h("span", { style: "font-weight:600;color:var(--qizil)" },
            "⚠ " + d.jobs_xato + " ta fon-ish xato bilan tugagan"),
            h("a.tug.kichik-t.osdi", { href: "#/jobs" }, "Ko'rish")))));
    }
    joy.appendChild(h("div.bolim-oraliq", { style: "margin-top:26px" },
      h("div.bolim-bosh", h("h2", "Oxirgi fon-ishlar")),
      jobsJadval(joy, 12)));
  }, { boshmi: function () { return false; } });
}

function jobsJadval(joy, limit) {
  const quti = h("div");
  holat.yur(quti, function () { return api.ol(A + "/jobs?limit=" + (limit || 50)); },
    function (qatorlar, el) {
      jadval(el, {
        qatorlar: qatorlar, sahifa: limit ? 12 : 25, qidiruvJoy: !limit,
        qidiruvMatn: "Tur yoki xato bo'yicha...",
        ustunlar: [
          { nom: "ID", kalit: "id", saralanadi: true },
          { nom: "Tur", kalit: "tur", saralanadi: true },
          { nom: "Holat", saralanadi: true, qiymat: function (q) { return q.holat; },
            chiz: function (q) { return jobBelgi(q.holat); } },
          { nom: "User", chiz: function (q) { return q.user_id || "—"; } },
          { nom: "Urinish", chiz: function (q) { return q.urinish + "×"; } },
          { nom: "Yaratilgan", saralanadi: true,
            qiymat: function (q) { return q.yaratilgan; },
            chiz: function (q) { return UI.vaqt(q.yaratilgan); } },
          { nom: "Xato", sinf: "uz-matn",
            chiz: function (q) { return (q.xato || "").slice(0, 90); } },
          { nom: "", sinf: "amallar", chiz: function (q) {
            return h("button.tug.kichik-t", { type: "button",
              onclick: function () { jobJurnal(q.id); } }, "Jurnal"); } },
        ],
        bosh: { ikon: "⚙", sarlavha: "Fon-ish yo'q" },
      });
    });
  return quti;
}

function jobBelgi(h_) {
  const r = { tayyor: "yashil-b", ketmoqda: "kok-b", navbatda: "sariq-b", xato: "qizil-b" };
  return h("span.belgi." + (r[h_] || ""), h_);
}

async function jobJurnal(jid) {
  const joy = h("div");
  modal({ sarlavha: "Fon-ish #" + jid, tan: joy, keng: true });
  holat.yur(joy, function () { return api.ol(A + "/job/" + jid); },
    function (d, el) {
      el.appendChild(h("div.qator", { style: "margin-bottom:12px" },
        jobBelgi(d.holat),
        d.xato ? h("span", { style: "color:var(--qizil)" }, d.xato) : null));
      el.appendChild(h("pre.kod-blok", (d.loglar || []).join("\n") || "(jurnal bo'sh)"));
    });
}

/* ================================================================ 2. TWINLAR */
function twinlarChiz(el) {
  holat.yur(el, function () { return api.ol(A + "/twinlar"); }, function (d, joy) {
    jadval(joy, {
      qatorlar: d, qidiruvMatn: "Nom yoki tavsif bo'yicha...",
      ustunlar: [
        { nom: "ID", kalit: "id", saralanadi: true },
        { nom: "Nom", saralanadi: true, qiymat: function (t) { return t.nom; },
          chiz: function (t) {
            return h("div", h("div", { style: "font-weight:600" }, t.nom),
              h("div.izoh.uz-matn", t.tavsif || "—")); } },
        { nom: "Kategoriya", chiz: function (t) { return t.kategoriya || "—"; } },
        { nom: "Egasi", chiz: function (t) { return t.egasi_ism || "—"; } },
        { nom: "Bilim", saralanadi: true,
          qiymat: function (t) { return t.bolak_soni; },
          chiz: function (t) { return t.bolak_soni + " bo'lak"; } },
        { nom: "Holat", chiz: function (t) {
          return h("span.belgi." + (t.faol ? "yashil-b" : ""), t.faol ? "faol" : "o'chiq"); } },
        { nom: "", sinf: "amallar", chiz: function (t) {
          return h("div.qator", { style: "justify-content:flex-end;gap:2px" },
            h("button.tug-ikon", { type: "button", title: "Tahrirlash",
              "aria-label": "Tahrirlash", onclick: function () { twinOyna(t); } }, "✎"),
            h("button.tug-ikon", { type: "button", title: "Bilim ruxsati",
              "aria-label": "Bilim ruxsati", onclick: function () { ruxsatOyna(t, d); } }, "🔗"),
            h("button.tug-ikon.xavf-i", { type: "button", title: "O'chirish",
              "aria-label": "O'chirish", onclick: function () { twinOchir(t); } }, "🗑")); } },
      ],
      bosh: { ikon: "🎓", sarlavha: "Ustoz yo'q",
              tan: "Birinchi raqamli ustozni qo'shing." },
    });
  }, { boshmi: function () { return false; } });
}

function twinOyna(t) {
  t = t || {};
  const nom = qator("Nom", t.nom || "");
  const tavsif = qator("Tavsif (mijoz ko'radi)", t.tavsif || "");
  const egasi = qator("Egasi (foydalanuvchi ID)", t.egasi_id || "", "number");
  const xulq = maydonKatta("Xarakter va uslub (ichki ko'rsatma)", t.xulq || "");
  const tan = h("div", nom.quti, tavsif.quti, egasi.quti, xulq.quti);
  modal({
    sarlavha: t.id ? "Ustozni tahrirlash" : "Yangi ustoz", tan: tan,
    amallar: [
      { nom: "Bekor", uslub: "shaffof" },
      { nom: "Saqlash", uslub: "asosiy", onclick: async function () {
        const d = { nom: nom.el.value.trim(), tavsif: tavsif.el.value.trim(),
                    xulq: xulq.el.value, egasi_id: egasi.el.value
                      ? parseInt(egasi.el.value, 10) : null };
        if (!d.nom) { toast("Nom bo'sh", "xato"); return false; }
        try {
          if (t.id) await api.yangila(A + "/twin/" + t.id, d);
          else await api.yubor(A + "/twin", d);
          toast("Saqlandi", "ok"); yur();
        } catch (e) { xatoToast(e); return false; }
      } },
    ],
  });
}

async function twinOchir(t) {
  const ok = await UI.tasdiq({
    sarlavha: "Ustozni o'chirish", xavfli: true, tasdiq: "O'chirish",
    matn: "«" + t.nom + "» va uning BARCHA bilimi (" + t.bolak_soni +
          " bo'lak, manbalar, suhbatlar) butunlay o'chiriladi. Buni qaytarib " +
          "bo'lmaydi.",
    yozish: t.nom });
  if (!ok) return;
  try { await api.ochir(A + "/twin/" + t.id); toast("O'chirildi", "ok"); yur(); }
  catch (e) { xatoToast(e); }
}

async function ruxsatOyna(t, hammasi) {
  const joy = h("div");
  modal({ sarlavha: "«" + t.nom + "» qaysi bilimdan foydalanadi", tan: joy });
  holat.yur(joy, function () { return api.ol(A + "/twin/" + t.id + "/ruxsat"); },
    function (d, el) {
      el.appendChild(h("div.izoh", { style: "margin-bottom:14px" },
        "Belgilangan ustozlarning bilim bazasi ham qidiruvga qo'shiladi. " +
        "O'z bilimi doim ochiq."));
      const belgi = {};
      hammasi.forEach(function (x) {
        if (x.id === t.id) return;
        const inp = h("input", { type: "checkbox" });
        inp.checked = (d.manbalar || []).indexOf(x.id) >= 0;
        belgi[x.id] = inp;
        el.appendChild(h("label.almash", { style: "display:flex;padding:7px 0" },
          inp, h("span.yol"), h("span", x.nom + " (" + x.bolak_soni + " bo'lak)")));
      });
      el.appendChild(h("button.tug.asosiy", { type: "button",
        style: "margin-top:14px", onclick: async function () {
          const tanlangan = Object.keys(belgi)
            .filter(function (k) { return belgi[k].checked; })
            .map(function (k) { return parseInt(k, 10); });
          try {
            await api.yangila(A + "/twin/" + t.id + "/ruxsat", { manbalar: tanlangan });
            toast("Saqlandi", "ok");
          } catch (e) { xatoToast(e); }
        } }, "Saqlash"));
    }, { boshmi: function () { return false; } });
}

/* ================================================================ 3. DIREKTORLAR */
function direktorlarChiz(el) {
  el.appendChild(h("div.karta", { style: "margin-bottom:18px" },
    h("div.karta-ich", h("div.izoh",
      "Direktorlar — «chuqur tahlil» rejimida ishlaydigan eski quvur. " +
      "Oddiy chat javobini bitta yordamchi beradi va bu ro'yxatga bog'liq emas."))));
  holat.yur(el, function () { return api.ol(A + "/direktorlar"); }, function (d, joy) {
    jadval(joy, {
      qatorlar: d, qidiruvMatn: "Kod, nom yoki teg bo'yicha...",
      ustunlar: [
        { nom: "Kod", saralanadi: true, qiymat: function (x) { return x.kod; },
          chiz: function (x) {
            return h("div.qator", h("span.rang-namuna",
              { style: "background:" + (/^#[0-9a-f]{3,8}$/i.test(x.rang || "")
                ? x.rang : "#888") }), h("b", x.kod)); } },
        { nom: "Nom", kalit: "nom", saralanadi: true },
        { nom: "Teglar", chiz: function (x) { return (x.teglar || []).join(", "); } },
        { nom: "Rol", chiz: function (x) {
          return x.rais ? h("span.belgi.sariq-b", "RAIS") : h("span.belgi", "direktor"); } },
        { nom: "Holat", chiz: function (x) {
          return h("span.belgi." + (x.faol ? "yashil-b" : ""), x.faol ? "faol" : "o'chiq"); } },
        { nom: "", sinf: "amallar", chiz: function (x) {
          return h("div.qator", { style: "justify-content:flex-end;gap:2px" },
            h("button.tug-ikon", { type: "button", title: "Tahrirlash",
              "aria-label": "Tahrirlash", onclick: function () { direktorOyna(x); } }, "✎"),
            h("button.tug-ikon", { type: "button",
              title: x.faol ? "O'chirish" : "Yoqish",
              "aria-label": x.faol ? "Vaqtincha o'chirish" : "Yoqish",
              onclick: async function () {
                try { await api.yangila(A + "/direktor/" + x.id, { faol: !x.faol });
                  yur(); } catch (e) { xatoToast(e); }
              } }, x.faol ? "⏸" : "▶"),
            h("button.tug-ikon.xavf-i", { type: "button", title: "O'chirish",
              "aria-label": "O'chirish", onclick: async function () {
                if (!await UI.tasdiq({ sarlavha: "Direktorni o'chirish", xavfli: true,
                  matn: "«" + x.kod + " — " + x.nom + "» o'chiriladi.",
                  tasdiq: "O'chirish" })) return;
                try { await api.ochir(A + "/direktor/" + x.id);
                  toast("O'chirildi", "ok"); yur(); } catch (e) { xatoToast(e); }
              } }, "🗑")); } },
      ],
      bosh: { ikon: "🏛", sarlavha: "Direktor yo'q" },
    });
  }, { boshmi: function () { return false; } });
}

function direktorOyna(x) {
  x = x || {};
  const kod = qator("Kod (CEO, CFO...)", x.kod || "");
  const nom = qator("To'liq nom", x.nom || "");
  const teglar = qator("Teglar (vergul bilan)", (x.teglar || ["umumiy"]).join(", "));
  const rang = h("input", { type: "color", value: /^#[0-9a-f]{6}$/i.test(x.rang || "")
    ? x.rang : "#5b8cff", style: "height:38px;padding:3px" });
  const rais = h("input", { type: "checkbox" });
  rais.checked = !!x.rais;
  const persona = maydonKatta("Persona — qanday fikrlaydi (prompt)", x.persona || "");
  persona.el.style.minHeight = "200px";
  const tan = h("div", kod.quti, nom.quti, teglar.quti,
    h("div.maydon-guruh", h("label.yorliq", "Rang"), rang),
    h("div.maydon-guruh", h("label.almash", rais, h("span.yol"),
      h("span", "Rais — yakuniy xulosani shu yozadi"))),
    persona.quti);
  modal({
    sarlavha: x.id ? "Direktorni tahrirlash" : "Yangi direktor", tan: tan, keng: true,
    amallar: [
      { nom: "Bekor", uslub: "shaffof" },
      { nom: "Saqlash", uslub: "asosiy", onclick: async function () {
        const d = { kod: kod.el.value.trim().toUpperCase(), nom: nom.el.value.trim(),
          persona: persona.el.value,
          teglar: teglar.el.value.split(",").map(function (s) { return s.trim(); })
            .filter(Boolean), rang: rang.value, rais: rais.checked };
        if (!d.kod || !d.nom || !d.persona) {
          toast("Kod, nom va persona to'ldirilsin", "xato"); return false; }
        try {
          if (x.id) await api.yangila(A + "/direktor/" + x.id, d);
          else await api.yubor(A + "/direktor", d);
          toast("Saqlandi", "ok"); yur();
        } catch (e) { xatoToast(e); return false; }
      } },
    ],
  });
}

/* ================================================================ 4. USERLAR */
function userlarChiz(el, arg) {
  holat.yur(el, function () { return api.ol(A + "/userlar?limit=500"); },
    function (d, joy) {
      jadval(joy, {
        qatorlar: d, qidiruvMatn: "Ism, email, username yoki telefon...",
        qidiruv: function (u, q) {
          return [u.ism, u.familiya, u.email, u.username, u.telefon, String(u.id)]
            .join(" ").toLowerCase().indexOf(q) >= 0;
        },
        ustunlar: [
          { nom: "ID", kalit: "id", saralanadi: true },
          { nom: "Kim", saralanadi: true, qiymat: function (u) { return u.ism; },
            chiz: function (u) {
              return h("div", h("div", { style: "font-weight:500" },
                (u.ism + " " + (u.familiya || "")).trim()),
                h("div.izoh", u.email || u.telefon || "—")); } },
          { nom: "Manba", chiz: function (u) {
            return h("span.belgi", u.tg_id ? "telegram" : (u.manba || "web")); } },
          { nom: "Rol", saralanadi: true, qiymat: function (u) { return u.rol; },
            chiz: function (u) {
              const r = { admin: "qizil-b", egasi: "sariq-b" };
              return h("span.belgi." + (r[u.rol] || ""), u.rol); } },
          { nom: "Holat", chiz: function (u) {
            return u.bloklangan ? h("span.belgi.qizil-b", "bloklangan")
              : h("span.belgi.yashil-b", "faol"); } },
          { nom: "Oxirgi kirish", saralanadi: true,
            qiymat: function (u) { return u.oxirgi_kirish; },
            chiz: function (u) { return UI.vaqt(u.oxirgi_kirish); } },
          { nom: "", sinf: "amallar", chiz: function (u) {
            return h("div.qator", { style: "justify-content:flex-end;gap:2px" },
              h("button.tug-ikon", { type: "button", title: "Tahrirlash",
                "aria-label": "Tahrirlash", onclick: function () { userOyna(u); } }, "✎"),
              h("button.tug-ikon", { type: "button", title: "Profil",
                "aria-label": "Profilni ko'rish",
                onclick: function () { userProfil(u.id); } }, "🧩"),
              h("button.tug-ikon", { type: "button", title: "Shu user nomidan kirish",
                "aria-label": "Shu user nomidan kirish",
                onclick: function () { impersonate(u); } }, "👤")); } },
        ],
        bosh: { ikon: "👥", sarlavha: "Foydalanuvchi yo'q" },
      });
      if (arg && arg[0]) {
        const u = d.find(function (x) { return x.id === parseInt(arg[0], 10); });
        if (u) userOyna(u);
      }
    }, { boshmi: function () { return false; } });
}

function userOyna(u) {

        { nom: "Izoh", kalit: "izoh" },
      ],
    });
  });
}

        "bizning tannarximizdan emas. B2C obunasi bu yerga kirmaydi. " +
        "Standart foiz 0 — ulush kelishilgach har ustozga qo'yiladi."))));
      const royaltiQuti = h("div");
      joy.appendChild(royaltiQuti);
      jadval(royaltiQuti, {
        qatorlar: d.royxat,
        ustunlar: [
          { nom: "Ustoz", kalit: "nom" },
          { nom: "Egasi", chiz: function (x) { return x.egasi || "—"; } },
          { nom: "30 kun B2B", chiz: function (x) { return UI.pul(x.b2b_usd); } },
          { nom: "Savollar", kalit: "savollar" },
          { nom: "Foiz", chiz: function (x) { return Number(x.royalti_foiz) + "%"; } },
          { nom: "Ulush", chiz: function (x) { return UI.pul(x.ulush_usd); } },
          { nom: "", chiz: function (x) {
              return tugma("✎", "", function () {
                const f = qator("Ulush foizi (0-100)", x.royalti_foiz, "number");
                modal({ sarlavha: "Ustoz ulushi: " + x.nom, tan: h("div", f.quti),
                  amallar: [
                    { nom: "Bekor", uslub: "shaffof" },
                    { nom: "Saqlash", uslub: "asosiy", onclick: async function () {
                      try {
                        await api.yangila(A + "/twin/" + x.id + "/royalti",
                          { foiz: parseFloat(f.el.value || "0") });
                        toast("Saqlandi", "ok"); yur();
                      } catch (e) { xatoToast(e); return false; }
                    } }],
                });
              }); } },
        ],
      });
    });
}

  xulosa:      function (a) { sahifa("xulosa", "Xulosa", xulosaChiz, [yangilaTug(yur)]); },
  twinlar:     function (a) { sahifa("twinlar", "Ustozlar", twinlarChiz,
                 [tugma("✚ Yangi ustoz", "asosiy kichik-t", function () { twinOyna(null); }),
                  yangilaTug(yur)]); },
  direktorlar: function (a) { sahifa("direktorlar", "Direktorlar", direktorlarChiz,
                 [tugma("✚ Yangi direktor", "asosiy kichik-t",
                   function () { direktorOyna(null); }), yangilaTug(yur)]); },
  userlar:     function (a) { sahifa("userlar", "Foydalanuvchilar",

  mentor:      function (a) { sahifa("mentor", "Mentorlik", mentorChiz,

  maqsad:      function (a) { sahifa("maqsad", "Maqsadlar", maqsadChiz,

  moliya:      function (a) { sahifa("moliya", "Moliya", moliyaChiz, [yangilaTug(yur)]); },

};

function yur() {
  const qism = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  const kod = qism[0] || "xulosa";
  (YOLLAR[kod] || YOLLAR.xulosa)(qism.slice(1));
}

const yon = UI.yonPanel($("#yon"), $("#menyu-tug"));

/* ================================================================ kirish */
async function kirishTekshir() {
  let k;
  try { k = await api.ol("/api/konfig"); }
  catch (e) {
    document.body.innerHTML = '<div class="holat-quti" style="height:100dvh">' +
      '<div class="ikon">⚠️</div><div class="sarlavha">Server javob bermayapti</div></div>';
    return;
  }
  if (k.user && k.user.rol === "admin") {
    KIM = k.user;
    $("#kim").textContent = (KIM.ism + " " + (KIM.familiya || "")).trim();
    $("#ilova").classList.remove("yashirin");
    $("#kirish").classList.add("yashirin");
    window.addEventListener("hashchange", yur);
    yur();
  } else {
    tgKirishChiz(k);
    $("#kirish").classList.remove("yashirin");
    $("#ilova").classList.add("yashirin");
    if (k.user) toast("Bu sahifa faqat administratorlar uchun", "xato");
  }
}

/* ============================================ kirish (faqat Telegram)
   Widget alohida sahifada (`/tg-widget`) ochiladi — sababi web.py dagi
   WIDGET_CSP izohida: Telegram skripti `eval` ishlatadi, bu sahifaning
   CSP'si esa uni bermaydi. Natija postMessage bilan qaytadi. */
function tgKirishChiz(konfig) {
  const joy = $("#k-joy");
  if (!joy) return;
  joy.innerHTML = "";
  if (konfig && konfig.bot) {
    joy.appendChild(h("div.izoh.markaz", { style: "margin-bottom:16px" },
      "Telegram akkauntingiz bilan kiring"));
    const f = h("iframe.tg-ramka", { src: "/tg-widget", title: "Telegram",
                                     scrolling: "no" });
    f.setAttribute("frameborder", "0");
    // O'lcham xabari kelmasa ham freym abadiy ko'rinmas qolmasin.
    setTimeout(function () { f.classList.add("tayyor"); }, 6000);
    joy.appendChild(f);
  } else {
    joy.appendChild(h("div.izoh.markaz",
      "Telegram bot sozlanmagan — kirish mumkin emas."));
  }
  if (konfig && konfig.zaxira_kirish) {
    const lg = h("input", { type: "text", autocomplete: "username" });
    const lp = h("input", { type: "password", autocomplete: "current-password" });
    const det = h("details", { style: "margin-top:18px" });
    det.appendChild(h("summary",
      { style: "cursor:pointer;font-size:13px;color:var(--xira)" },
      "Zaxira kirish"));
    det.appendChild(h("div", { style: "margin-top:10px" },
      h("div.maydon-guruh", h("label.yorliq", "Login"), lg),
      h("div.maydon-guruh", h("label.yorliq", "Parol"), lp),
      h("button.tug.keng", { type: "button", onclick: async function () {
        try {
          await api.yubor("/api/kirish/parol",
            { login: lg.value, parol: lp.value });
          kirishTekshir();
        } catch (e) { xatoToast(e); }
      } }, "Kirish")));
    joy.appendChild(det);
  }
}

window.addEventListener("message", function (ev) {
  // Faqat o'z sahifamizdan kelgan xabar.
  if (ev.origin !== location.origin) return;
  let d;
  try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (!d || !d.twin_tg) return;
  if (d.twin_tg === "olcham") {
    $$(".tg-ramka").forEach(function (f) {
      f.style.height = Math.min(Math.max(d.balandlik, 28), 120) + "px";
      if (d.kenglik) {
        f.style.width = Math.min(Math.max(d.kenglik, 120), 400) + "px";
      }
      f.classList.add("tayyor");
    });
    return;
  }
  if (d.twin_tg !== "ok") {
    toast(d.xabar || "Telegram orqali kirish bajarilmadi", "xato");
    return;
  }
  location.reload();
});

$("#mavzu-tug").addEventListener("click", function () { UI.mavzu.almash(); });
$("#yon-yop").addEventListener("click", function () { yon.yop(); });

kirishTekshir();
})();
